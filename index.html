      <div class="pill"><div class="pill-lbl">Individually logged</div><div class="pill-val">${cShells.length}</div></div>
      <div class="pill green"><div class="pill-lbl">Intact</div><div class="pill-val">${intact}</div></div>
      <div class="pill"><div class="pill-lbl">Total NEW (lbs)</div><div class="pill-val">${lbs(c.remainingShells*c.newW)}</div></div>
    </div>
    <div class="card-pad" style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
      <span style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.06em">Quick-adjust remaining:</span>
      <div class="qty-ctrl">
        <button class="btn-icon" style="width:28px;height:28px;font-size:16px" onclick="adjustRemaining(${c.id},-1)">−</button>
        <span class="qty-val" style="font-size:18px;min-width:60px">${c.remainingShells}<span class="qty-frac" style="font-size:13px">/${c.totalShells}</span></span>
        <button class="btn-icon" style="width:28px;height:28px;font-size:16px" onclick="adjustRemaining(${c.id},1)">+</button>
      </div>
      <span style="font-size:12px;color:#555">Used: ${c.totalShells-c.remainingShells} · NEW used: ${lbs((c.totalShells-c.remainingShells)*c.newW)} lbs</span>
    </div>
    <div class="sec">Log individual shell</div>
    <div class="card-pad">
      <div class="form-grid" style="grid-template-columns:2fr 1fr 2fr auto;align-items:flex-end">
        <div class="fld"><label>Shell description / lot</label><input id="sf-desc" placeholder="${esc('e.g. '+c.name+' — lot 24B')}" value="${esc(state.shellForm.desc)}" oninput="state.shellForm.desc=this.value" onkeydown="if(event.key==='Enter')addShellLog(${c.id})"></div>
        <div class="fld"><label>Net Wt (lbs) <span style="color:#444">def: ${lbs(c.newW)}</span></label><input id="sf-wt" type="number" min=".0001" step=".0001" placeholder="${lbs(c.newW)}" value="${esc(state.shellForm.shellNewW)}" oninput="state.shellForm.shellNewW=this.value"></div>
        <div class="fld"><label>Notes (optional)</label><input id="sf-notes" placeholder="Condition, lot, variant…" value="${esc(state.shellForm.notes)}" oninput="state.shellForm.notes=this.value"></div>
        <button class="btn-primary" onclick="addShellLog(${c.id})" style="align-self:flex-end">+ Add shell</button>
      </div>
      <div class="help-txt">Shell number format: <code style="background:#1a1a1a;padding:2px 6px;border-radius:3px;color:var(--amber)">${c.catalogNum.split('-')[1]}-N</code> — next: <strong style="font-family:var(--mono);color:var(--amber)">${nextShellNum(c.id)}</strong></div>
    </div>
    <div class="sec">Individual shell log — ${cShells.length} logged</div>
    ${cShells.length===0
      ? `<div class="card-pad empty">No shells logged individually yet.</div>`
      : `<div class="card"><div style="overflow-x:auto"><table>
          <colgroup><col style="width:13%"><col style="width:23%"><col style="width:9%"><col style="width:12%"><col style="width:16%"><col style="width:18%"><col style="width:9%"></colgroup>
          <thead><tr><th>Shell #</th><th>Description / lot</th><th>Net Wt (lbs)</th><th>Status</th><th>Check-in</th><th>Used on</th><th>Notes</th><th></th></tr></thead>
          <tbody>${shellRows}</tbody>
          <tfoot><tr><td colspan="2">Totals</td><td>${lbs(cShells.reduce((s,x)=>s+x.newW,0))} lbs</td><td colspan="4"></td></tr></tfoot>
        </table></div></div>`}`;
}

// ── SHOWS TAB ──────────────────────────────────────────────────────────────
function renderShowsTab() {
  const el = document.getElementById('panel-shows');
  if (state.selectedShow) { renderShowDetail(el); return; }
  const {cases,assignments,shells} = state.data; const shows = state.shows;
  const {showForm,showErr} = state;

  const rows = shows.map(sh => {
    const shAssign = assignments.filter(a=>a.showId===sh.id);
    const shShellAssignL = (state.data.shellAssignments||[]).filter(a=>a.showId===sh.id&&!a.bulkAssignId);
    const shNEW = shAssign.reduce((s,a)=>{const c=cases.find(x=>x.id===a.caseId);return s+(c?a.qty*c.newW:0);},0)
      + shShellAssignL.reduce((s,a)=>{const sl=shells.find(x=>x.id===a.shellId);return s+(sl?sl.newW:0);},0);
    const shShells = shAssign.reduce((s,a)=>s+a.qty,0) + shShellAssignL.length;
    const shCases = new Set([...shAssign.map(a=>a.caseId),...shShellAssignL.map(a=>a.caseId)]).size;
    return `<tr style="cursor:pointer" onclick="openShowDetail(${sh.id})">
      <td style="font-weight:700;font-family:var(--mono)">${esc(sh.name)}</td>
      <td style="font-size:12px;color:#888;font-family:var(--mono)">${sh.date||'—'}</td>
      <td style="font-size:12px;color:#888">${esc(sh.location||'—')}</td>
      <td>${shCases}</td>
      <td style="font-family:var(--mono)">${shShells}</td>
      <td style="font-weight:${shNEW>0?600:400};font-family:var(--mono)">${shNEW>0?lbs(shNEW):'—'}</td>
      <td>${statusBadge(sh.status,SHOW_STATUS)}</td>
      <td onclick="event.stopPropagation()">
        <div style="display:flex;gap:4px">
          <button class="btn-sm" style="font-size:11px" onclick="openShowDetail(${sh.id})">Open</button>
          <button class="btn-sm" style="font-size:11px;padding:3px 7px" title="Print labels for this show" onclick="printShowLabels(${sh.id})">🏷</button>
          <button class="btn-danger" onclick="removeShow(${sh.id})">×</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="sec">Create a show</div>
    <div class="card-pad">
      <div class="form-grid" style="grid-template-columns:2fr 1fr 1.5fr 1fr;align-items:flex-end">
        <div class="fld"><label>Show name</label><input placeholder="e.g. July 4th Riverside 2026" value="${esc(showForm.name)}" oninput="state.showForm.name=this.value" onkeydown="if(event.key==='Enter')addShow()"></div>
        <div class="fld"><label>Date</label><input type="date" value="${esc(showForm.date)}" oninput="state.showForm.date=this.value"></div>
        <div class="fld"><label>Location</label><input placeholder="e.g. Riverside Park" value="${esc(showForm.location)}" oninput="state.showForm.location=this.value"></div>
        <div class="fld"><label>&nbsp;</label><button class="btn-primary" onclick="addShow()" style="width:100%">+ Add show</button></div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr">
        <div class="fld"><label>Notes (optional)</label><input placeholder="Optional notes" value="${esc(showForm.notes)}" oninput="state.showForm.notes=this.value"></div>
      </div>
      ${showErr?`<div class="err-txt">${esc(showErr)}</div>`:''}
    </div>
    <div class="sec" style="display:flex;align-items:center;justify-content:space-between">
      <span>All shows</span>
      ${shows.length>0?`<button class="btn-sm" style="font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.04em" onclick="exportShowData()">&#x25BC; Export Show Data</button>`:''}
    </div>
    ${shows.length===0
      ? `<div class="card-pad empty">No shows yet. Create one above.</div>`
      : `<div class="card"><div style="overflow-x:auto"><table>
          <colgroup><col style="width:22%"><col style="width:10%"><col style="width:13%"><col style="width:8%"><col style="width:9%"><col style="width:11%"><col style="width:11%"><col style="width:10%"></colgroup>
          <thead><tr><th>Show name</th><th>Date</th><th>Location</th><th>Cases</th><th>Shells</th><th>Total NEW (lbs)</th><th>Status</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div></div>`}`;
}

// ── Show detail ────────────────────────────────────────────────────────────
function renderShowDetail(el) {
  const {cases,assignments,shells,shellAssignments} = state.data; const shows = state.shows;
  const sh = shows.find(s=>s.id===state.selectedShow);
  if (!sh) { state.selectedShow=null; renderShowsTab(); return; }
  const shAssign = assignments.filter(a=>a.showId===sh.id);
  // Exclude shell assignments created by bulk case assignments (already counted via shAssign qty)
  const shShellAssign = (shellAssignments||[]).filter(a=>a.showId===sh.id);
  const shShellAssignManual = shShellAssign.filter(a=>!a.bulkAssignId);
  const shNEWfromCases = shAssign.reduce((s,a)=>{const c=cases.find(x=>x.id===a.caseId);return s+(c?a.qty*c.newW:0);},0);
  const shNEWfromShells = shShellAssignManual.reduce((s,a)=>{const sl=shells.find(x=>x.id===a.shellId);return s+(sl?sl.newW:0);},0);
  const shNEW = shNEWfromCases + shNEWfromShells;
  const shShellsFromCases = shAssign.reduce((s,a)=>s+a.qty,0);
  const shShells = shShellsFromCases + shShellAssignManual.length;
  const shCases = new Set([...shAssign.map(a=>a.caseId),...shShellAssignManual.map(a=>a.caseId)]).size;
  const availCases = cases.filter(c=>c.remainingShells>0);
  const {assignForm,assignErr} = state;

  // Case-level assignment rows
  const caseAssignRows = shAssign.map(a => {
    const c = cases.find(x=>x.id===a.caseId);
    if (!c) return '';
    return `<tr>
      <td><span style="font-size:10px;background:#2e1f0a;color:#fbbf24;padding:2px 6px;border-radius:3px;font-weight:700;font-family:var(--mono)">CASE</span></td>
      <td><span class="mono-tag">${esc(c.catalogNum)}</span></td>
      <td style="font-weight:600">${esc(c.name)}</td>
      <td>${badge(c.cls)}</td>
      <td style="font-size:12px;color:#888">${esc(c.mfg||'—')}</td>
      <td>
        <div class="qty-ctrl">
          <button class="btn-icon" onclick="updateAssignQty(${a.id},-1)">−</button>
          <span class="qty-val" style="font-size:14px;min-width:28px">${a.qty}</span>
          <button class="btn-icon" onclick="updateAssignQty(${a.id},1)">+</button>
        </div>
      </td>
      <td style="font-weight:600;font-family:var(--mono)">${lbs(a.qty*c.newW)}</td>
      <td style="font-size:12px;color:#888">${new Date(a.assignedAt).toLocaleDateString()}</td>
      <td><button class="btn-danger" onclick="removeAssignment(${a.id})">×</button></td>
    </tr>`;
  }).join('');

  // Individual shell assignment rows
  const shellAssignRows = shShellAssignManual.map(a => {
    const sl = shells.find(x=>x.id===a.shellId);
    const c = sl ? cases.find(x=>x.id===sl.caseId) : null;
    if (!sl) return '';
    return `<tr>
      <td><span style="font-size:10px;background:#1a2e1f;color:#86efac;padding:2px 6px;border-radius:3px;font-weight:700;font-family:var(--mono)">SHELL</span></td>
      <td><span class="mono-tag">${esc(sl.shellNum)}</span></td>
      <td style="font-weight:600">${esc(sl.desc)}</td>
      <td>${c?badge(c.cls):'—'}</td>
      <td style="font-size:12px;color:#888">${c?esc(c.catalogNum+' · '+(c.mfg||'')):'—'}</td>
      <td style="font-size:12px;color:#888">1 shell</td>
      <td style="font-weight:600;font-family:var(--mono)">${lbs(sl.newW)}</td>
      <td style="font-size:12px;color:#888">${new Date(a.assignedAt).toLocaleDateString()}</td>
      <td><button class="btn-danger" onclick="removeShellAssignment(${a.id})">×</button></td>
    </tr>`;
  }).join('');

  const assignRows = caseAssignRows + shellAssignRows;

  el.innerHTML = `
    <div class="detail-hdr">
      <button class="btn-sm" onclick="state.selectedShow=null;renderTab('shows')">← Shows</button>
      <span class="detail-name">${esc(sh.name)}</span>
      ${sh.date?`<span style="font-size:12px;color:#666;font-family:var(--mono)">${sh.date}</span>`:''}
      ${sh.location?`<span style="font-size:12px;color:#666">· ${esc(sh.location)}</span>`:''}
      ${statusBadge(sh.status,SHOW_STATUS)}
      <select style="width:auto;height:28px;font-size:12px" onchange="updateShowStatus(${sh.id},this.value)">
        ${Object.entries(SHOW_STATUS).map(([k,v])=>`<option value="${k}"${sh.status===k?' selected':''}>${v.label}</option>`).join('')}
      </select>
      <button class="btn-sm" style="margin-left:auto;font-size:11px" onclick="printShowLabels(${sh.id})">🏷 Print Labels</button>
    </div>
    <div class="metrics" style="grid-template-columns:repeat(4,1fr)">
      <div class="pill"><div class="pill-lbl">Shells assigned</div><div class="pill-val">${shShells}</div></div>
      <div class="pill"><div class="pill-lbl">Total NEW (lbs)</div><div class="pill-val">${lbs(shNEW)}</div></div>
      <div class="pill"><div class="pill-lbl">Cases used</div><div class="pill-val">${shCases}</div></div>
      <div class="pill"><div class="pill-lbl">Status</div><div class="pill-val" style="font-size:16px">${(SHOW_STATUS[sh.status]||{label:sh.status}).label}</div></div>
    </div>
    ${sh.notes?`<div class="card-pad" style="font-size:13px;color:#888;border-left:3px solid var(--amber);margin-bottom:16px"><strong style="color:var(--text2)">Notes:</strong> ${esc(sh.notes)}</div>`:''}
    <div class="sec">Assign shells from container</div>
    <div class="card-pad">
      <div class="form-grid" style="grid-template-columns:3fr 1fr auto;align-items:flex-end">
        <div class="fld"><label>Case from container</label>
          <select oninput="state.assignForm.caseId=this.value">
            <option value="">— select a case —</option>
            ${availCases.map(c=>{
              const alreadyQty=assignments.filter(a=>a.caseId===c.id&&a.showId===sh.id).reduce((s,a)=>s+a.qty,0);
              const avail=c.remainingShells-alreadyQty;
              return `<option value="${c.id}"${assignForm.caseId==c.id?' selected':''}${avail<=0?' disabled':''}>${esc(c.catalogNum)} · ${esc(c.name)} — ${avail} avail${c.mfg?' · '+esc(c.mfg):''}</option>`;
            }).join('')}
          </select>
        </div>
        <div class="fld"><label>Qty (shells)</label><input type="number" min="1" step="1" value="${esc(assignForm.qty)}" oninput="state.assignForm.qty=this.value" onkeydown="if(event.key==='Enter')doAssign(${sh.id})"></div>
        <button class="btn-primary" onclick="doAssign(${sh.id})" style="align-self:flex-end">+ Assign</button>
      </div>
      ${assignErr?`<div class="err-txt">${esc(assignErr)}</div>`:''}
      <div class="help-txt">Shells remain tracked in the container. Assignment records what is planned/used for this show.</div>
    </div>
    <div class="sec">Assign individual logged shells</div>
    <div class="card-pad">
      ${(()=>{
        // Get cases that have logged shells not yet assigned to this show
        const casesWithShells = cases.filter(c => shells.some(s => s.caseId === c.id && !shShellAssign.some(sa => sa.shellId === s.id)));
        if (casesWithShells.length === 0) return '<div style="font-size:13px;color:#555">No individually logged shells available. Log shells in the Cases tab first.</div>';
        return `<div class="form-grid" style="grid-template-columns:1.5fr 3fr auto;align-items:flex-end">
          <div class="fld"><label>Case</label>
            <select id="sa-case-sel" onchange="state.assignForm.shellCaseId=this.value;renderTab('shows')">
              <option value="">— pick case —</option>
              ${casesWithShells.map(c => {
                const cShells = shells.filter(s => s.caseId===c.id && !shShellAssign.some(sa=>sa.shellId===s.id));
                return '<option value="' + c.id + '"' + (state.assignForm.shellCaseId==c.id?' selected':'') + '>' + esc(c.catalogNum) + ' · ' + esc(c.name) + ' (' + cShells.length + ' shells avail)</option>';
              }).join('')}
            </select>
          </div>
          <div class="fld"><label>Shells (check to assign)</label>
            <div style="display:flex;flex-direction:column;gap:4px;padding:6px 0;min-height:34px">
              ${(()=>{
                if (!state.assignForm.shellCaseId) return '<span style="font-size:12px;color:#555">Select a case above</span>';
                const cid = parseInt(state.assignForm.shellCaseId);
                const availShells = shells.filter(s => s.caseId===cid && !shShellAssign.some(sa=>sa.shellId===s.id));
                if (!availShells.length) return '<span style="font-size:12px;color:#555">No unassigned shells in this case</span>';
                if (!state.assignForm.selectedShells) state.assignForm.selectedShells = {};
                return availShells.map(s => {
                  const checked = state.assignForm.selectedShells[s.id] ? 'checked' : '';
                  const sc = {intact:'#14291a',used:'#2e0f0f',damaged:'#2e1f0a',missing:'#1a1a1a'};
                  const tc = {intact:'#4ade80',used:'#fca5a5',damaged:'#fbbf24',missing:'#6b7280'};
                  const dSt = shellDisplayStatus(s.id);
                  return '<label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:' + (SHELL_SC[dSt]||'#1e1e1e') + ';padding:5px 10px;border-radius:5px;border:1px solid #2a2a2a;margin-bottom:2px">'
                    + '<input type="checkbox" ' + checked + ' onchange="toggleShellSelect(' + s.id + ',this.checked)" style="width:14px;height:14px;accent-color:#d97706;flex-shrink:0">'
                    + '<span style="font-family:var(--mono);font-size:11px;color:' + (SHELL_TC[dSt]||'#888') + ';font-weight:700">' + esc(s.shellNum) + '</span>'
                    + '<span style="font-size:12px;color:#e5e5e5;font-weight:500">' + esc(s.desc) + '</span>'
                    + '<span style="font-size:11px;color:#555;font-family:var(--mono)">' + lbs(s.newW) + ' lbs</span>'
                    + '<span style="font-size:10px;font-weight:700;font-family:var(--mono);color:' + (SHELL_TC[dSt]||'#888') + ';background:rgba(0,0,0,.3);padding:1px 5px;border-radius:3px">' + dSt.toUpperCase() + '</span>'
                    + '</label>';
                }).join('');
              })()}
            </div>
          </div>
          <button class="btn-primary" onclick="assignSelectedShells(${sh.id})" style="align-self:flex-end">+ Assign selected</button>
        </div>`;
      })()}
      <div class="help-txt">Individual shells stay in the container and remain tracked. Select multiple shells using the checkboxes.</div>
    </div>
    <div class="sec">Assigned shells — ${shShells} shell${shShells!==1?'s':''} from ${shCases} case${shCases!==1?'s':''} · ${lbs(shNEW)} lbs NEW</div>
    ${(shAssign.length===0 && shShellAssign.length===0)
      ? `<div class="card-pad empty">No shells assigned yet. Use the forms above.</div>`
      : `<div class="card">
          ${shAssign.length>0?`
          <div style="padding:8px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fbbf24;border-bottom:1px solid var(--border1);background:#0d0d0d">
            Case-level assignments (${shShellsFromCases} shell${shShellsFromCases!==1?'s':''})
          </div>
          <div style="overflow-x:auto">
          <table>
            <colgroup><col style="width:11%"><col style="width:25%"><col style="width:8%"><col style="width:13%"><col style="width:12%"><col style="width:11%"><col style="width:12%"><col style="width:8%"></colgroup>
            <thead><tr><th>Catalog #</th><th>Description</th><th>Class</th><th>Manufacturer</th><th>Shells assigned</th><th>NEW (lbs)</th><th>Assigned on</th><th></th></tr></thead>
            <tbody>${caseAssignRows}</tbody>
          </table></div>`:``}
          ${shShellAssign.length>0?`
          <div style="padding:8px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#86efac;border-bottom:1px solid var(--border1);border-top:${shAssign.length>0?'1px solid var(--border2)':'none'};background:#0d0d0d">
            Individual shells (${shShellAssign.length} shell${shShellAssign.length!==1?'s':''})
          </div>
          <div style="overflow-x:auto">
          <table>
            <colgroup><col style="width:11%"><col style="width:27%"><col style="width:8%"><col style="width:9%"><col style="width:11%"><col style="width:13%"><col style="width:9%"><col style="width:8%"><col style="width:4%"></colgroup>
            <thead><tr><th>Shell #</th><th>Description / lot</th><th>Class</th><th>Status</th><th>From case</th><th>Mfg</th><th>NEW (lbs)</th><th>Assigned on</th><th></th></tr></thead>
            <tbody>
              ${shShellAssign.map(a => {
                const sl = shells.find(x=>x.id===a.shellId);
                const c = sl ? cases.find(x=>x.id===sl.caseId) : null;
                if (!sl) return '';
                const sc={intact:'#14291a',used:'#2e0f0f',damaged:'#2e1f0a',missing:'#1a1a1a'};
                const tc={intact:'#4ade80',used:'#fca5a5',damaged:'#fbbf24',missing:'#6b7280'};
                return `<tr>
                  <td><span class="mono-tag">${esc(sl.shellNum)}</span></td>
                  <td style="font-weight:600">${esc(sl.desc)}</td>
                  <td>${c?badge(c.cls):'—'}</td>
                  <td><span style="font-size:11px;background:${SHELL_SC[shellDisplayStatus(sl.id)]||'#1e1e1e'};color:${SHELL_TC[shellDisplayStatus(sl.id)]||'#888'};padding:2px 7px;border-radius:3px;font-weight:700;font-family:var(--mono)">${shellDisplayStatus(sl.id)}</span></td>
                  <td style="font-size:12px;color:#888;font-family:var(--mono)">${c?esc(c.catalogNum):'—'}</td>
                  <td style="font-size:12px;color:#888">${c?esc(c.mfg||'—'):'—'}</td>
                  <td style="font-weight:600;font-family:var(--mono)">${lbs(sl.newW)}</td>
                  <td style="font-size:12px;color:#888">${new Date(a.assignedAt).toLocaleDateString()}</td>
                  <td><button class="btn-danger" onclick="removeShellAssignment(${a.id})">×</button></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>`:``}
          <div style="display:flex;justify-content:flex-end;padding:8px 14px;border-top:1px solid var(--border2);font-size:12px;color:#555;font-family:var(--mono)">
            Total: <strong style="color:#e5e5e5;margin:0 0 0 8px">${shShells} shell${shShells!==1?'s':''} · ${lbs(shNEW)} lbs NEW</strong>
          </div>
        </div>`}`;
}

// ── ADD CASE TAB ───────────────────────────────────────────────────────────
function renderAddTab() {
  const el = document.getElementById('panel-add');
  const {caseForm,caseErr} = state;
  el.innerHTML = `
    <div class="sec">Add case manually</div>
    <div class="card-pad">
      <div class="form-grid" style="grid-template-columns:2fr 1.2fr 0.7fr 0.6fr 1fr 1fr 0.9fr 0.7fr 0.7fr 0.7fr;align-items:flex-end">
        <div class="fld"><label>Product description</label><input placeholder="e.g. 3in Red Peony shell" value="${esc(caseForm.name)}" oninput="state.caseForm.name=this.value;state.caseForm.shellSize=state.caseForm.shellSize||extractShellSize(this.value)"></div>
        <div class="fld"><label>Manufacturer</label><input placeholder="e.g. Acme Pyro" value="${esc(caseForm.mfg)}" oninput="state.caseForm.mfg=this.value"></div>
        <div class="fld"><label>EX #</label><input placeholder="e.g. EX-1234" value="${esc(caseForm.exNum)}" oninput="state.caseForm.exNum=this.value" style="font-family:var(--mono)"></div>
        <div class="fld"><label>Shell size</label><input placeholder='e.g. 3"' value="${esc(caseForm.shellSize)}" oninput="state.caseForm.shellSize=this.value" style="font-family:var(--mono)"></div>
        <div class="fld"><label>ATF class</label>
          <select onchange="state.caseForm.cls=this.value">
            ${ATF_CLASSES.map(c=>`<option value="${c.value}"${caseForm.cls===c.value?' selected':''}>${c.label}</option>`).join('')}
          </select>
        </div>
        <div class="fld"><label>Product type</label>
          <select onchange="state.caseForm.productType=this.value">
            ${PRODUCT_TYPES.map(t=>`<option value="${t}"${caseForm.productType===t?' selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="fld"><label>NEW / unit (lbs)</label><input type="number" min=".0001" step=".0001" placeholder="0.0938" value="${esc(caseForm.newW)}" oninput="state.caseForm.newW=this.value"></div>
        <div class="fld"><label>Units / case</label><input type="number" min="1" step="1" placeholder="24" value="${esc(caseForm.isSingle?'1':caseForm.isChain?String((parseInt(caseForm.chainCount)||0)*(parseInt(caseForm.shellsPerChain)||0)*(parseInt(caseForm.boxCount)||1)||''):caseForm.totalShells)}" ${caseForm.isChain?'readonly style="background:#0a0a0a;color:#888;cursor:default"':''} oninput="state.caseForm.totalShells=this.value"></div>
        ${caseForm.isSingle?`
        <div class="fld">
          <label>Qty to add <span style="font-size:11px;color:#555;font-weight:400">(# of cases)</span></label>
          <input type="number" min="1" step="1" placeholder="1" value="${esc(caseForm.singleQty||'1')}"
            oninput="state.caseForm.singleQty=this.value"
            style="font-family:var(--mono);color:#86efac">
        </div>`:''}
        <div class="fld"><label>Case cost ($)</label><input type="number" min="0" step="0.01" placeholder="0.00" value="${esc(caseForm.caseCost)}" oninput="state.caseForm.caseCost=this.value"></div>
        <div class="fld"><label>Unit cost ($)</label><input type="text" readonly style="background:#0a0a0a;color:#888;cursor:default" value="${caseForm.caseCost&&caseForm.totalShells&&parseInt(caseForm.totalShells)>0?'$'+(parseFloat(caseForm.caseCost)/parseInt(caseForm.totalShells)).toFixed(2):'auto'}"></div>
      </div>
      <div class="form-grid" style="grid-template-columns:auto 1fr 1fr 1fr auto auto;align-items:flex-end;gap:12px;margin-top:8px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#86efac">
            <input type="checkbox" ${caseForm.isSingle?'checked':''} onchange="state.caseForm.isSingle=this.checked;if(this.checked){state.caseForm.isChain=false;state.caseForm.isAssortment=false;state.caseForm.totalShells='1';}renderTab('add')" style="width:15px;height:15px;accent-color:#86efac">
            Single unit <span style="font-size:11px;color:#555;font-weight:400">(1 shell/unit per case · status: open)</span>
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#aaa">
            <input type="checkbox" ${caseForm.isChain?'checked':''} onchange="state.caseForm.isChain=this.checked;if(this.checked){state.caseForm.isAssortment=false;state.caseForm.isSingle=false;}renderTab('add')" style="width:15px;height:15px;accent-color:#d97706">
            Chain product
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#aaa">
            <input type="checkbox" ${caseForm.isAssortment?'checked':''} onchange="state.caseForm.isAssortment=this.checked;if(this.checked){state.caseForm.isChain=false;state.caseForm.isSingle=false;}renderTab('add')" style="width:15px;height:15px;accent-color:#60a5fa">
            Assortment
          </label>
        </div>
        ${caseForm.isChain?`
        <div class="fld">
          <label>Chains per box <span style="color:#555;font-size:10px">(first #)</span></label>
          <input type="number" min="1" step="1" placeholder="6" value="${esc(caseForm.chainCount)}" oninput="state.caseForm.chainCount=this.value;state.caseForm.totalShells=String((parseInt(this.value)||0)*(parseInt(state.caseForm.shellsPerChain)||0)*(parseInt(state.caseForm.boxCount)||1));renderTab('add')">
        </div>
        <div class="fld">
          <label>Shells per chain <span style="color:#555;font-size:10px">(second #)</span></label>
          <input type="number" min="1" step="1" placeholder="10" value="${esc(caseForm.shellsPerChain)}" oninput="state.caseForm.shellsPerChain=this.value;state.caseForm.totalShells=String((parseInt(state.caseForm.chainCount)||0)*(parseInt(this.value)||0)*(parseInt(state.caseForm.boxCount)||1));renderTab('add')">
        </div>
        <div class="fld">
          <label>Boxes <span style="color:#555;font-size:10px">(third #)</span></label>
          <input type="number" min="1" step="1" placeholder="1" value="${esc(caseForm.boxCount||'1')}" oninput="state.caseForm.boxCount=this.value;state.caseForm.totalShells=String((parseInt(state.caseForm.chainCount)||0)*(parseInt(state.caseForm.shellsPerChain)||0)*(parseInt(this.value)||1));renderTab('add')">
        </div>
        <div class="fld">
          <label>Packing</label>
          <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:#fbbf24;padding:6px 0;line-height:1">${caseForm.chainCount||'?'}/${caseForm.shellsPerChain||'?'}/${caseForm.boxCount||'1'}</div>
          <div style="font-size:10px;color:#555;margin-top:2px">${(parseInt(caseForm.chainCount)||0)*(parseInt(caseForm.shellsPerChain)||0)*(parseInt(caseForm.boxCount)||1)||'—'} total shells</div>
        </div>
        `:(caseForm.isAssortment?`
        <div style="grid-column:span 4">
          <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#60a5fa;margin-bottom:8px">Assortment — all shells are ${esc(caseForm.shellSize||'same size')}. Add each effect and how many of that effect are in the case.</div>
          <div style="display:flex;gap:8px;margin-bottom:10px;align-items:flex-end;flex-wrap:wrap">
            <div class="fld" style="flex:3;margin-bottom:0;min-width:180px"><label>Effect / description</label><input id="asst-desc-input" placeholder="e.g. Red Peony, Brocade Crown…" onkeydown="if(event.key==='Enter'){addAssortmentShell();event.preventDefault()}" style="width:100%"></div>
            <div class="fld" style="flex:0 0 90px;margin-bottom:0"><label>Qty</label><input id="asst-qty-input" type="number" min="1" step="1" value="1" placeholder="1" style="width:100%"></div>
            <button class="btn-primary" onclick="addAssortmentShell()" style="flex-shrink:0;height:36px;align-self:flex-end">+ Add</button>
          </div>
          ${(caseForm.assortmentShells||[]).length===0
            ? '<div style="font-size:12px;color:#444;padding:4px 0">No effects added yet. Enter an effect name, set the quantity, and click Add.</div>'
            : `<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">
                ${(()=>{
                  // Group by description to show effect rows with qty badges
                  const groups = {};
                  const order = [];
                  (caseForm.assortmentShells||[]).forEach((s,i)=>{
                    if(!groups[s]){groups[s]={count:0,firstIdx:i};order.push(s);}
                    groups[s].count++;
                  });
                  return order.map(desc=>`
                    <div style="display:flex;align-items:center;gap:8px;background:#111;border:1px solid #1e2e3e;border-radius:5px;padding:5px 10px">
                      <span style="font-size:13px;color:#e5e5e5;flex:1">${esc(desc)}</span>
                      <span style="font-family:var(--mono);font-size:12px;color:#60a5fa;font-weight:700;background:#1a2233;padding:2px 8px;border-radius:4px">×${groups[desc].count}</span>
                      <button onclick="changeAssortmentQty('${esc(desc).replace(/'/g,"\\'")}', -1)" style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:3px;color:#aaa;cursor:pointer;width:22px;height:22px;font-size:14px;line-height:1;padding:0">−</button>
                      <button onclick="changeAssortmentQty('${esc(desc).replace(/'/g,"\\'")}', 1)" style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:3px;color:#aaa;cursor:pointer;width:22px;height:22px;font-size:14px;line-height:1;padding:0">+</button>
                      <button onclick="removeAssortmentEffect('${esc(desc).replace(/'/g,"\\'")}')}" style="background:none;border:none;color:#555;cursor:pointer;font-size:16px;padding:0;line-height:1">×</button>
                    </div>`).join('');
                })()}
              </div>
              <div style="font-size:11px;color:#60a5fa;font-family:var(--mono)">${(caseForm.assortmentShells||[]).length} total shell${(caseForm.assortmentShells||[]).length!==1?'s':''} · ${[...new Set(caseForm.assortmentShells||[])].length} unique effect${[...new Set(caseForm.assortmentShells||[])].length!==1?'s':''}</div>`}
        </div>
        `:'<div></div><div></div><div></div><div></div>')}
        <div class="fld"><label>Initial show / event (optional)</label><input placeholder="e.g. July 4th Riverside 2026" value="${esc(caseForm.show)}" oninput="state.caseForm.show=this.value"></div>
        <button class="btn-primary" onclick="addCase()" style="align-self:flex-end">+ Add case</button>
      </div>
      <div class="fld" style="margin-top:8px">
        <label style="display:flex;align-items:center;justify-content:space-between">
          <span>Notes <span style="font-size:11px;color:#555;font-weight:400">(optional — storage condition, lot number, purchase info, etc.)</span></span>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#aaa;font-weight:400;white-space:nowrap;margin-left:16px">
            <input type="checkbox" ${caseForm.notesOnReport?'checked':''} onchange="state.caseForm.notesOnReport=this.checked"
              style="width:14px;height:14px;accent-color:#d97706">
            Show on ATF report
          </label>
        </label>
        <textarea rows="3" placeholder="e.g. Lot #WZ-2024-04, stored in north magazine, purchased from Wizard July 2024…"
          style="width:100%;resize:vertical;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:5px;color:#e5e5e5;padding:8px 10px;font-size:13px;font-family:inherit;box-sizing:border-box;margin-top:4px"
          oninput="state.caseForm.notes=this.value">${esc(caseForm.notes||'')}</textarea>
      </div>
      ${caseErr?`<div class="err-txt">${esc(caseErr)}</div>`:''}
      <div class="help-txt">Catalog number auto-generated as <span style="font-family:var(--mono);color:var(--amber)">2026-XXXX</span>.</div>
    </div>`;
}

// ── IMPORT TAB ─────────────────────────────────────────────────────────────

// ── REPORT TAB ─────────────────────────────────────────────────────────────
function renderReportTab() {
  const el = document.getElementById('panel-report');
  const {cases,shells,assignments} = state.data; const shows = state.shows;
  const shellAssignmentsRpt = state.data.shellAssignments||[];
  const {container,licensee} = state;
  const showHidden = state.reportShowHidden || false;

  // Split cases: visible on report vs hidden
  const reportCases = cases.filter(c => showHidden || !c.hideFromReport);

  const caseRows = reportCases.flatMap(c => {
    const cShells = shells.filter(s=>s.caseId===c.id);
    const cAssign = assignments.filter(a=>a.caseId===c.id);
    const cShellAssign = (shellAssignmentsRpt||[]).filter(a=>a.caseId===c.id);
    const allShowNames = [
      ...cAssign.map(a=>{const sh=shows.find(s=>s.id===a.showId);return sh?`${sh.name} (${a.qty} shells)`:null;}),
      ...[...new Set(cShellAssign.map(a=>a.showId))].map(sid=>{
        const sh=shows.find(s=>s.id===sid);
        const cnt=cShellAssign.filter(a=>a.showId===sid).length;
        return sh?`${sh.name} (${cnt} shell${cnt!==1?'s':''})`:null;
      })
    ].filter(Boolean);
    const assignStr = allShowNames.join(', ');

    // Dates
    const checkinDt = c.createdAt||c.addedAt ? new Date(c.createdAt||c.addedAt) : null;
    const checkinStr = checkinDt ? checkinDt.toLocaleDateString() : '—';
    // Check-out = first removal log entry for this case's shells or the case itself
    const caseRmLog = (state.data.removalLog||[]).filter(e=>e.catalogNum===c.catalogNum||cShells.some(s=>s.shellNum===e.shellNum));
    const lastOut = caseRmLog.length ? new Date(Math.max(...caseRmLog.map(e=>new Date(e.removedAt)))) : null;
    const checkoutStr = lastOut ? lastOut.toLocaleDateString() : '—';

    const shellRows = cShells.map(s=>{
      const sIn = s.addedAt ? new Date(s.addedAt).toLocaleDateString() : checkinStr;
      const sOut = s.usedAt ? new Date(s.usedAt).toLocaleDateString() : '—';
      return `<tr>
        <td class="td-sub"><span class="mono-tag" style="font-size:11px">↳ ${esc(s.shellNum)}</span></td>
        <td class="td-sub">${esc(s.desc)}</td>
        <td class="td-sub" colspan="2"></td>
        <td class="td-sub" style="text-align:right;font-family:var(--mono)">${lbs(s.newW)}</td>
        <td class="td-sub" style="text-align:right">1/1</td>
        <td class="td-sub" style="text-align:right;font-family:var(--mono)">${lbs(s.newW)}</td>
        <td class="td-sub">${shellDisplayStatus(s.id)}</td>
        <td class="td-sub"></td>
        <td class="td-sub" style="font-family:var(--mono);font-size:11px;color:#888">
          ${sIn}
          <br>${dpBtn(s.addedAt||'',iso=>{updateLogTs('shell',s.id,iso);renderTab('report')},'Set date')}
        </td>
        <td class="td-sub" style="font-family:var(--mono);font-size:11px;color:#fca5a5">
          ${sOut}
          ${s.usedAt ? '<br>'+dpBtn(s.usedAt,iso=>{updateLogTs('shellused',s.id,iso);renderTab('report')},'Set date') : ''}
        </td>
      </tr>`;
    }).join('');
    return [`<tr style="${c.hideFromReport?'opacity:0.45;':''}">
      <td><span class="mono-tag">${esc(c.catalogNum)}</span></td>
      <td style="font-weight:600">${esc(c.name)}</td>
      <td>${badge(c.cls)}</td>
      <td style="font-size:12px;color:#888">${esc(c.mfg||'—')}</td>
      <td style="font-family:var(--mono);font-size:12px;color:#fbbf24">${esc(c.exNum||'—')}</td>
      <td style="font-size:12px;color:#aaa">${esc(c.productType||'Shell')}</td>
      <td style="text-align:right;font-family:var(--mono)">${lbs(c.newW)}</td>
      <td style="text-align:right;font-family:var(--mono)">${c.remainingShells}/${c.totalShells}</td>
      <td style="text-align:right;font-weight:600;font-family:var(--mono)">${lbs(c.totalShells*c.newW)}</td>
      <td>${statusBadge(caseDisplayStatus(c))}</td>
      <td style="font-size:12px;color:#888">${esc(assignStr||'—')}</td>
      <td style="font-family:var(--mono);font-size:11px;color:#86efac">
        ${checkinStr}
        <br>${dpBtn(c.createdAt||'',iso=>{updateLogTs('case',c.id,iso);renderTab('report')},'Set date')}
      </td>
      <td style="font-family:var(--mono);font-size:11px;color:#fca5a5">
        ${checkoutStr}
        ${(()=>{
          const rmEntry = (state.data.removalLog||[]).find(e=>e.type==='case'&&e.catalogNum===c.catalogNum);
          if (!rmEntry) return '';
          const d=new Date(rmEntry.removedAt);const p=n=>String(n).padStart(2,'0');
          const dtVal=isNaN(d)?'':`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
          return '<br>'+dpBtn(rmEntry.removedAt||'',iso=>{updateLogTs('removal',rmEntry.id,iso);renderTab('report')},'Set date');
        })()}
      </td>
      <td style="text-align:center;white-space:nowrap">
        <button onclick="toggleHideFromReport('${c.id}')" title="${c.hideFromReport?'Restore to ATF report':'Remove from ATF report'}"
          style="font-size:10px;padding:2px 7px;border-radius:3px;border:1px solid ${c.hideFromReport?'#16a34a':'#7f1d1d'};background:${c.hideFromReport?'#052e16':'#1a0505'};color:${c.hideFromReport?'#4ade80':'#f87171'};cursor:pointer;white-space:nowrap">
          ${c.hideFromReport ? '✓ Restore' : '✕ Remove'}
        </button>
      </td>
    </tr>
    ${c.notes && c.notesOnReport ? `<tr><td colspan="13" style="padding:4px 14px 8px;font-size:11px;color:#888;font-style:italic;background:#080808;border-bottom:1px solid #111">
      <span style="color:#555;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:10px;font-style:normal">Notes: </span>${esc(c.notes)}
    </td></tr>` : ''}`, shellRows];
  }).flat().join('');

  const showRows = shows.map(sh=>{
    const shAssign=assignments.filter(a=>a.showId===sh.id);
    const shShellA=shellAssignmentsRpt.filter(a=>a.showId===sh.id&&!a.bulkAssignId);
    const shNEW=shAssign.reduce((s,a)=>{const c=cases.find(x=>x.id===a.caseId);return s+(c?a.qty*c.newW:0);},0)
      +shShellA.reduce((s,a)=>{const sl=shells.find(x=>x.id===a.shellId);return s+(sl?sl.newW:0);},0);
    const shShells=shAssign.reduce((s,a)=>s+a.qty,0)+shShellA.length;
    const shCases=new Set([...shAssign.map(a=>a.caseId),...shShellA.map(a=>a.caseId)]).size;
    return `<tr>
      <td style="font-weight:700">${esc(sh.name)}</td>
      <td style="font-family:var(--mono)">${sh.date||'—'}</td>
      <td>${esc(sh.location||'—')}</td>
      <td style="text-align:right">${shCases}</td>
      <td style="text-align:right;font-family:var(--mono)">${shShells}</td>
      <td style="text-align:right;font-family:var(--mono)">${shNEW>0?lbs(shNEW):'—'}</td>
      <td>${statusBadge(sh.status,SHOW_STATUS)}</td>
    </tr>`;
  }).join('');

  const tNEW = reportCases.reduce((s,c)=>s+c.totalShells*c.newW,0);  const tRem = reportCases.reduce((s,c)=>s+c.remainingShells,0);
  const tTot = reportCases.reduce((s,c)=>s+c.totalShells,0);

  el.innerHTML = `
    <div class="card-pad">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div style="font-size:14px;font-weight:700;color:#e5e5e5;letter-spacing:.02em;text-transform:uppercase">Explosive Materials Inventory Report</div>
        <div style="display:flex;gap:6px;align-items:center">
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:#888;cursor:pointer;white-space:nowrap">
            <input type="checkbox" ${showHidden?'checked':''} onchange="state.reportShowHidden=this.checked;renderTab('report')" style="accent-color:var(--amber)">
            Show removed
          </label>
          <button class="btn-sm" style="text-transform:uppercase;font-weight:700;font-size:11px;letter-spacing:.04em" onclick="exportExcel()">&#x25BC; Export Excel</button>
          <button class="btn-sm" style="text-transform:uppercase;font-weight:700;font-size:11px;letter-spacing:.04em" onclick="printReport()">&#x1F5A8; Print / PDF</button>
        </div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
        <div class="fld"><label>Container / Magazine ID</label><input placeholder="e.g. MAG-001" value="${esc(container)}" oninput="state.container=this.value"></div>
        <div class="fld"><label>Licensee Name / Company</label><input placeholder="e.g. Star Pyrotechnics LLC" value="${esc(licensee)}" oninput="state.licensee=this.value"></div>
      </div>
      <div class="report-meta-row">
        <span>${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</span>
        <span>·</span><span>Container: <strong>${esc(container||'—')}</strong></span>
        <span>·</span><span>Licensee: <strong>${esc(licensee||'—')}</strong></span>
      </div>

      <div class="sec" style="margin-top:16px">Container contents</div>
      <div style="overflow-x:auto;margin-bottom:20px">
        <table>
          <colgroup><col style="width:8%"><col style="width:14%"><col style="width:5%"><col style="width:8%"><col style="width:6%"><col style="width:6%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:6%"><col style="width:10%"><col style="width:8%"><col style="width:7%"></colgroup>
          <thead><tr><th>Catalog #</th><th>Description</th><th>Class</th><th>Manufacturer</th><th>EX #</th><th>Type</th><th>NEW/unit (lbs)</th><th>Units rem/tot</th><th>Case NEW (lbs)</th><th>Status</th><th>Assigned to show(s)</th><th style="color:#86efac">Check-in</th><th style="color:#fca5a5">Check-out</th><th></th></tr></thead>
          <tbody>${caseRows||`<tr><td colspan="13" class="empty">No inventory recorded.</td></tr>`}</tbody>
          ${cases.length>0?`<tfoot><tr><td colspan="7">Totals</td><td style="font-family:var(--mono)">${tRem}/${tTot}</td><td style="font-family:var(--mono)">${lbs(tNEW)} lbs</td><td colspan="4"></td></tr></tfoot>`:''}
        </table>
      </div>

      ${shows.length>0?`
        <div class="sec">Shows</div>
        <div style="overflow-x:auto">
          <table>
            <colgroup><col style="width:22%"><col style="width:10%"><col style="width:13%"><col style="width:8%"><col style="width:11%"><col style="width:12%"><col style="width:12%"></colgroup>
            <thead><tr><th>Show name</th><th>Date</th><th>Location</th><th>Cases</th><th>Shells assigned</th><th>Total NEW (lbs)</th><th>Status</th></tr></thead>
            <tbody>${showRows}</tbody>
          </table>
        </div>`:''}
    </div>`;
}

// ── Actions ────────────────────────────────────────────────────────────────
// Auto-log individual shells for a newly added case
// Generate next sequential shell number for a case: XXXX-N (4-digit case suffix + sequence)
function nextShellNum(caseId) {
  const c = state.data.cases.find(x=>x.id===caseId);
  const suffix = c ? c.catalogNum.split('-')[1] : '0000';
  // Find max existing sequence number for this case across active shells and removal log
  const prefix = suffix + '-';
  const existing = [
    ...(state.data.shells||[]).filter(s=>s.caseId===caseId).map(s=>s.shellNum),
    ...(state.data.removalLog||[]).filter(e=>e.type==='shell'&&(e.shellNum||'').startsWith(prefix)).map(e=>e.shellNum),
  ];
  let max = 0;
  existing.forEach(num => {
    const parts = (num||'').split('-');
    const n = parseInt(parts[parts.length-1]);
    if (!isNaN(n) && n > max) max = n;
  });
  return `${suffix}-${max + 1}`;
}

function autoLogShells(c) {
  const baseNewW = c.newW;
  const now = Date.now();
  const suffix = c.catalogNum.split('-')[1];

  if (c.isChain && c.chainCount && c.shellsPerChain) {
    const chainDesc = `${c.name} — chain of ${c.shellsPerChain} (${c.shellsPerChain} shells/fuse)`;
    for (let i = 0; i < c.chainCount; i++) {
      state.data.shells.push({
        id: now + i + Math.floor(Math.random()*1000),
        caseId: c.id, shellNum: `${suffix}-${i + 1}`,
        desc: chainDesc, newW: baseNewW * c.shellsPerChain,
        shellsPerUnit: c.shellsPerChain, isChain: true,
        notes: `Chain: ${c.shellsPerChain} shells on 1 fuse`,
        status: 'intact', addedAt: c.createdAt || new Date().toISOString()
      });
    }
  } else if (c.isAssortment && c.assortmentEffects && c.assortmentEffects.length > 0) {
    // Each effect in the assortment becomes its own individually named shell
    c.assortmentEffects.forEach((effect, i) => {
      state.data.shells.push({
        id: now + i + Math.floor(Math.random()*1000),
        caseId: c.id, shellNum: `${suffix}-${i + 1}`,
        desc: effect.trim(), newW: baseNewW,
        notes: `Assortment: ${c.name}`,
        status: 'intact', isAssortment: true,
        addedAt: c.createdAt || new Date().toISOString()
      });
    });
  } else {
    const baseDesc = c.name.trim();
    for (let i = 0; i < c.totalShells; i++) {
      state.data.shells.push({
        id: now + i + Math.floor(Math.random()*1000),
        caseId: c.id, shellNum: `${suffix}-${i + 1}`,
        desc: baseDesc, newW: baseNewW,
        notes: '', status: 'intact',
        addedAt: c.createdAt || new Date().toISOString()
      });
    }
  }
}

function addAssortmentShell() {
  const inp = document.getElementById('asst-desc-input');
  const qtyInp = document.getElementById('asst-qty-input');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  const qty = Math.max(1, parseInt(qtyInp?.value)||1);
  if (!state.caseForm.assortmentShells) state.caseForm.assortmentShells = [];
  for (let i = 0; i < qty; i++) state.caseForm.assortmentShells.push(val);
  state.caseForm.totalShells = String(state.caseForm.assortmentShells.length);
  inp.value = '';
  if (qtyInp) qtyInp.value = '1';
  renderTab('add');
  setTimeout(()=>{ const i=document.getElementById('asst-desc-input'); if(i)i.focus(); }, 50);
}
function changeAssortmentQty(desc, delta) {
  if (!state.caseForm.assortmentShells) return;
  const shells = state.caseForm.assortmentShells;
  const count = shells.filter(s=>s===desc).length;
  const newCount = Math.max(0, count + delta);
  if (newCount === 0) {
    state.caseForm.assortmentShells = shells.filter(s=>s!==desc);
  } else if (delta > 0) {
    state.caseForm.assortmentShells.push(desc);
  } else {
    // Remove one instance
    const idx = shells.lastIndexOf(desc);
    if (idx !== -1) state.caseForm.assortmentShells.splice(idx, 1);
  }
  state.caseForm.totalShells = String(state.caseForm.assortmentShells.length);
  renderTab('add');
}
function removeAssortmentEffect(desc) {
  if (!state.caseForm.assortmentShells) return;
  state.caseForm.assortmentShells = state.caseForm.assortmentShells.filter(s=>s!==desc);
  state.caseForm.totalShells = String(state.caseForm.assortmentShells.length);
  renderTab('add');
}
function removeAssortmentShell(idx) {
  if (!state.caseForm.assortmentShells) return;
  state.caseForm.assortmentShells.splice(idx, 1);
  state.caseForm.totalShells = String(state.caseForm.assortmentShells.length);
  renderTab('add');
}

function addCase() {
  const {name,mfg,cls,productType,newW,totalShells,show,shellSize,caseCost,exNum,isSingle,isChain,chainCount,shellsPerChain,boxCount,isAssortment,assortmentShells,notes,notesOnReport} = state.caseForm;
  if (!name.trim()) { state.caseErr='Product description required.'; renderTab('add'); return; }
  if (!parseFloat(newW)||parseFloat(newW)<=0) { state.caseErr='Net explosive weight required.'; renderTab('add'); return; }

  let n;
  if (isSingle) {
    n = 1; // each case holds exactly 1 unit
  } else if (isChain) {
    const cc = parseInt(chainCount), spc = parseInt(shellsPerChain), bc = parseInt(boxCount)||1;
    if (!cc||cc<1||!spc||spc<1) { state.caseErr='Chains per box and shells per chain are required.'; renderTab('add'); return; }
    n = cc * spc * bc;
  } else if (isAssortment) {
    if (!assortmentShells||assortmentShells.length<1) { state.caseErr='Add at least one shell effect to the assortment.'; renderTab('add'); return; }
    n = assortmentShells.length;
  } else {
    n = parseInt(totalShells);
    if (!n||n<1) { state.caseErr='Shell count required.'; renderTab('add'); return; }
  }

  const singleQtyN = isSingle ? Math.max(1, parseInt(state.caseForm.singleQty)||1) : 1;

  state.caseErr = '';
  const autoSize = shellSize.trim() || extractShellSize(name);
  const bc2 = isChain ? (parseInt(boxCount)||1) : null;

  for (let q = 0; q < singleQtyN; q++) {
  const newCase = {
    id:Date.now() + Math.random(), catalogNum:genId('case'),
    name:name.trim(), mfg:mfg.trim(), cls, newW:parseFloat(newW)*16,
    shellSize: autoSize,
    productType: productType||'Shell',
    exNum: exNum.trim()||null,
    caseCost: parseFloat(caseCost)||null,
    isSingle: isSingle||false,
    isChain: isChain||false,
    chainCount: isChain ? parseInt(chainCount) : null,
    shellsPerChain: isChain ? parseInt(shellsPerChain) : null,
    boxCount: bc2,
    packingStr: isChain ? `${parseInt(chainCount)}/${parseInt(shellsPerChain)}/${bc2}` : null,
    isAssortment: isAssortment||false,
    assortmentEffects: isAssortment ? [...(assortmentShells||[])] : null,
    totalShells:n, remainingShells:n, show:show.trim(),
    status: isSingle ? 'open' : 'sealed',
    notes: notes.trim()||null, notesOnReport: notesOnReport||false,
    source:'manual', createdAt:new Date().toISOString()
  };
  state.data.cases.push(newCase);
  autoLogShells(newCase);
  }
  save();
  state.caseForm = {name:'',mfg:'',cls:'1C',productType:'Shell',newW:'',totalShells:'',show:show,shellSize:'',caseCost:'',exNum:'',isSingle:false,singleQty:'1',notes:'',notesOnReport:false,isChain:false,chainCount:'',shellsPerChain:'',boxCount:'1',isAssortment:false,assortmentShells:[]};
  switchTab('cases');
}

function removeCase(id) {
  const c = state.data.cases.find(x=>x.id===id);
  if (c) {
    if (!state.data.removalLog) state.data.removalLog = [];
    const cAssign = state.data.assignments.filter(a=>a.caseId===id);
    const cShellAssign = (state.data.shellAssignments||[]).filter(a=>a.caseId===id);
    const showNames = [...new Set([
      ...cAssign.map(a=>{ const s=state.shows.find(x=>x.id===a.showId); return s?s.name:null; }),
      ...cShellAssign.map(a=>{ const s=state.shows.find(x=>x.id===a.showId); return s?s.name:null; }),
    ].filter(Boolean))];

    const cShells = state.data.shells.filter(s=>s.caseId===id);

    if (c.isSingle) {
      // Single unit — log as shell only, not as case
      const s = cShells[0];
      if (s) {
        const sShowIds = (state.data.shellAssignments||[]).filter(a=>a.shellId===s.id).map(a=>a.showId);
        const sShowNames = [...new Set(sShowIds.map(sid=>{ const sh=state.shows.find(x=>x.id===sid); return sh?sh.name:null; }).filter(Boolean))];
        state.data.removalLog.push({
          id: Date.now(), type:'shell', removedAt: new Date().toISOString(),
          parentCatalog: c.catalogNum, parentName: c.name,
          shellNum: s.shellNum, desc: s.desc, newW: s.newW, status: s.status,
          shows: sShowNames.length ? sShowNames : showNames, removedWithCase: false,
        });
      } else {
        // No shell logged yet — log minimal shell entry from case data
        state.data.removalLog.push({
          id: Date.now(), type:'shell', removedAt: new Date().toISOString(),
          parentCatalog: c.catalogNum, parentName: c.name,
          shellNum: c.catalogNum, desc: c.name, newW: c.newW, status: c.status,
          shows: showNames, removedWithCase: false,
        });
      }
    } else {
      // Regular case — log case entry + each shell
      state.data.removalLog.push({
        id: Date.now(), type:'case', removedAt: new Date().toISOString(),
        catalogNum: c.catalogNum, name: c.name, mfg: c.mfg||'', cls: c.cls,
        newW: c.newW, totalShells: c.totalShells, remainingShells: c.remainingShells,
        shows: showNames,
      });
      cShells.forEach((s,i) => {
        const sShowIds = (state.data.shellAssignments||[]).filter(a=>a.shellId===s.id).map(a=>a.showId);
        const sShowNames = [...new Set(sShowIds.map(sid=>{ const sh=state.shows.find(x=>x.id===sid); return sh?sh.name:null; }).filter(Boolean))];
        state.data.removalLog.push({
          id: Date.now()+i+1, type:'shell', removedAt: new Date().toISOString(),
          parentCatalog: c.catalogNum, parentName: c.name,
          shellNum: s.shellNum, desc: s.desc, newW: s.newW, status: s.status,
          shows: sShowNames, removedWithCase: true,
        });
      });
    }
  }
  state.data.cases = state.data.cases.filter(x=>x.id!==id);
  state.data.shells = state.data.shells.filter(s=>s.caseId!==id);
  state.data.assignments = state.data.assignments.filter(a=>a.caseId!==id);
  if (state.data.shellAssignments) state.data.shellAssignments = state.data.shellAssignments.filter(a=>a.caseId!==id);
  if (state.expandedCase===id) state.expandedCase=null;
  save(); renderTab(state.tab);
}

function updateCaseStatus(id, status) {
  const c = state.data.cases.find(x=>x.id===id);
  if (!c) return;

  if (status === 'used') {
    // Mark used — log to removalLog but KEEP in data (stays on ATF report)
    c.status = 'used';
    c.usedAt = c.usedAt || new Date().toISOString();
    const alreadyLogged = (state.data.removalLog||[]).some(e=>
      e.markedUsed && (e.catalogNum===c.catalogNum || e.parentCatalog===c.catalogNum)
    );
    if (!alreadyLogged) {
      if (!state.data.removalLog) state.data.removalLog = [];
      const cAssign = state.data.assignments.filter(a=>a.caseId===id);
      const cShellAssign = (state.data.shellAssignments||[]).filter(a=>a.caseId===id);
      const showNames = [...new Set([
        ...cAssign.map(a=>{const s=state.shows.find(x=>x.id===a.showId);return s?s.name:null;}),
        ...cShellAssign.map(a=>{const s=state.shows.find(x=>x.id===a.showId);return s?s.name:null;}),
      ].filter(Boolean))];

      if (c.isSingle) {
        // Single unit — log as shell only
        const shell = state.data.shells.find(s=>s.caseId===id);
        state.data.removalLog.push({
          id: Date.now(), type:'shell', removedAt: c.usedAt,
          parentCatalog: c.catalogNum, parentName: c.name,
          shellNum: shell?.shellNum||c.catalogNum,
          desc: shell?.desc||c.name,
          newW: c.newW, status: 'used',
          shows: showNames, markedUsed: true,
        });
      } else {
        state.data.removalLog.push({
          id: Date.now(), type:'case', removedAt: c.usedAt,
          catalogNum: c.catalogNum, name: c.name, mfg: c.mfg||'', cls: c.cls,
          newW: c.newW, totalShells: c.totalShells, remainingShells: c.remainingShells,
          shows: showNames, markedUsed: true,
        });
      }
    }
  } else if (c.status === 'used') {
    // Un-marking used — remove from removalLog, restore status
    state.data.removalLog = (state.data.removalLog||[]).filter(e=>
      !(e.markedUsed && (e.catalogNum===c.catalogNum || e.parentCatalog===c.catalogNum))
    );
    delete c.usedAt;
    c.status = c.remainingShells === 0 ? 'empty' : c.remainingShells < c.totalShells ? 'partial' : 'open';
  } else {
    // Normal status transitions (shell-count enforced)
    if (c.remainingShells === 0) c.status = 'empty';
    else if (c.remainingShells < c.totalShells) {
      c.status = status === 'sealed' ? 'partial' : status;
    } else {
      c.status = (status === 'empty' || status === 'partial') ? 'sealed' : status;
    }
  }
  save(); renderTab(state.tab);
}

function removeCaseFromContainer(id) {
  // Physically remove a 'used' case from inventory — log entry already exists
  const c = state.data.cases.find(x=>x.id===id);
  if (!c || c.status !== 'used') return;
  // Case stays in removalLog — just delete from active data
  state.data.cases = state.data.cases.filter(x=>x.id!==id);
  state.data.shells = state.data.shells.filter(s=>s.caseId!==id);
  state.data.assignments = state.data.assignments.filter(a=>a.caseId!==id);
  if (state.data.shellAssignments) state.data.shellAssignments = state.data.shellAssignments.filter(a=>a.caseId!==id);
  if (state.expandedCase===id) state.expandedCase=null;
  save(); renderTab(state.tab);
}

// Extract shell size from a case name/description string
// Matches patterns like: 3in, 3", 3inch, 3 in, 3-inch, 4", 2.5in, 1.75", etc.
function extractShellSize(name) {
  if (!name) return '';
  const m = name.match(/(\d+(?:\.\d+)?)\s*(?:"|in(?:ch)?)\b/i);
  if (m) return m[1] + '"';
  // Also try leading number before a space or end e.g. "3 Red Peony"
  const m2 = name.match(/^(\d+(?:\.\d+)?)\s/);
  if (m2) return m2[1] + '"';
  return '';
}

  render();

function adjustRemaining(id, delta) {
  const c = state.data.cases.find(x=>x.id===id);
  if (!c) return;
  const r = Math.max(0, Math.min(c.totalShells, c.remainingShells+delta));
  c.remainingShells = r;
  c.status = r===0?'empty':r===c.totalShells?'sealed':'partial';
  save(); renderTab('cases');
}

function checkCaseAllShellsUsed(caseId) {
  // If all shells in the case are used, auto-log the case as used
  const c = state.data.cases.find(x=>x.id===caseId);
  if (!c || c.isSingle) return; // single units already logged as shell — skip
  if (c.status === 'used') return; // already done

  const cShells = state.data.shells.filter(s=>s.caseId===caseId);
  if (!cShells.length) return;
  const allUsed = cShells.every(s=>s.status==='used');
  if (!allUsed) return;

  // All shells used — mark case as used and log it
  const usedAt = cShells.reduce((latest, s) => {
    const t = s.usedAt ? new Date(s.usedAt).getTime() : 0;
    return t > new Date(latest).getTime() ? s.usedAt : latest;
  }, new Date(0).toISOString());

  c.status = 'used';
  c.usedAt = c.usedAt || usedAt;

  // Log if not already logged
  const alreadyLogged = (state.data.removalLog||[]).some(e=>
    e.markedUsed && e.type==='case' && e.catalogNum===c.catalogNum
  );
  if (!alreadyLogged) {
    if (!state.data.removalLog) state.data.removalLog = [];
    const cAssign = state.data.assignments.filter(a=>a.caseId===caseId);
    const cShellAssign = (state.data.shellAssignments||[]).filter(a=>a.caseId===caseId);
    const showNames = [...new Set([
      ...cAssign.map(a=>{const sh=state.shows.find(x=>x.id===a.showId);return sh?sh.name:null;}),
      ...cShellAssign.map(a=>{const sh=state.shows.find(x=>x.id===a.showId);return sh?sh.name:null;}),
      ...cShells.map(s=>s.usedOnShow).filter(Boolean),
    ].filter(Boolean))];
    state.data.removalLog.push({
      id: Date.now() + Math.random(),
      type: 'case',
      // Set removedAt to last shell's time + 1ms so case always sorts after all shells
      removedAt: new Date(new Date(c.usedAt).getTime() + 1).toISOString(),
      catalogNum: c.catalogNum, name: c.name, mfg: c.mfg||'', cls: c.cls,
      newW: c.newW, totalShells: c.totalShells, remainingShells: 0,
      shows: showNames, markedUsed: true, autoMarked: true,
      parentCatalog: c.catalogNum, // self-reference so shell entries can match
    });
  }
}

function updateShellStatus(id, newStatus) {
  const s = state.data.shells.find(x=>x.id===id);
  if (!s) return;
  const prevStatus = s.status;
  const wasUsed = prevStatus === 'used';
  const nowUsed = newStatus === 'used';

  s.status = newStatus;

  // ── Mark used ──────────────────────────────────────────────────────────────
  if (nowUsed && !wasUsed) {
    s.usedAt = new Date().toISOString();
    // Find any show this shell is assigned to
    const sa = (state.data.shellAssignments||[]).find(a=>a.shellId===id);
    if (sa) {
      const sh = state.shows.find(x=>x.id===sa.showId);
      s.usedOnShow = sh ? sh.name : null;
    } else {
      s.usedOnShow = null;
    }
    // Decrement remainingShells on parent case
    const c = state.data.cases.find(x=>x.id===s.caseId);
    if (c && c.remainingShells > 0) {
      c.remainingShells = Math.max(0, c.remainingShells - 1);
      c.status = c.remainingShells === 0 ? 'empty' : 'partial';
    }
    // Add to removal log
    if (!state.data.removalLog) state.data.removalLog = [];
    state.data.removalLog.push({
      id: Date.now(), type: 'shell', removedAt: s.usedAt,
      parentCatalog: (state.data.cases.find(x=>x.id===s.caseId)||{}).catalogNum||'',
      parentName: (state.data.cases.find(x=>x.id===s.caseId)||{}).name||'',
      shellNum: s.shellNum, desc: s.desc, newW: s.newW,
      status: 'used', shows: s.usedOnShow ? [s.usedOnShow] : [],
      removedWithCase: false, markedUsed: true,
    });
    // Auto-log case if all shells are now used
    checkCaseAllShellsUsed(s.caseId);
  }

  // ── Un-mark used (restore remaining) ──────────────────────────────────────
  if (wasUsed && !nowUsed) {
    s.usedAt = null;
    s.usedOnShow = null;
    // Restore 1 to parent case remaining
    const c = state.data.cases.find(x=>x.id===s.caseId);
    if (c && c.remainingShells < c.totalShells) {
      c.remainingShells = Math.min(c.totalShells, c.remainingShells + 1);
      c.status = c.remainingShells === c.totalShells ? 'sealed' : 'partial';
    }
    // If case was auto-marked used because all shells were used, un-mark it too
    if (c && c.status === 'used' && c.autoMarked !== false) {
      state.data.removalLog = (state.data.removalLog||[]).filter(e=>
        !(e.markedUsed && e.autoMarked && e.type==='case' && e.catalogNum===c.catalogNum)
      );
      delete c.usedAt;
      c.status = 'partial';
    }
    // Remove the "markedUsed" log entry for this shell if it exists
    state.data.removalLog = (state.data.removalLog||[]).filter(e=>
      !(e.markedUsed && e.shellNum === s.shellNum && e.type === 'shell')
    );
  }

  save(); renderTab('cases');
}

function startEditShell(id) {
  const s = state.data.shells.find(x=>x.id===id);
  if (!s) return;
  state.editingShell = {id:s.id, newW:String((s.newW/16).toFixed(4)), desc:s.desc};
  renderTab('cases');
}
function shellEditKeydown(e) {
  if(e.key==='Enter') saveEditingShell();
  if(e.key==='Escape') { state.editingShell=null; renderTab('cases'); }
}
function saveUsedDate(id, dateStr) {
  const s = state.data.shells.find(x=>x.id===id);
  if (!s) return;
  // dateStr is YYYY-MM-DD from the date input
  s.usedAt = dateStr ? dateStr + 'T00:00:00.000Z' : null;
  // Also update the removal log entry for this shell if it exists
  const logEntry = (state.data.removalLog||[]).find(e=>e.markedUsed && e.shellNum===s.shellNum);
  if (logEntry) logEntry.removedAt = s.usedAt;
  save(); renderTab('cases');
}

function saveEditingShell() {
  if (!state.editingShell) return;
  const s = state.data.shells.find(x=>x.id===state.editingShell.id);
  if (s) {
    const lbsVal = parseFloat(state.editingShell.newW);
    if (lbsVal>0) s.newW = lbsVal*16;
    if (state.editingShell.desc.trim()) s.desc = state.editingShell.desc.trim();
  }
  state.editingShell = null;
  save(); renderTab('cases');
}

function addShow() {
  if (!state.showForm.name.trim()) { state.showErr='Show name required.'; renderTab('shows'); return; }
  state.showErr = '';
  state.shows.push({
    id:Date.now(), name:state.showForm.name.trim(),
    date:state.showForm.date, location:state.showForm.location.trim(),
    notes:state.showForm.notes.trim(), status:'upcoming',
    createdAt:new Date().toISOString()
  });
  state.showForm = {name:'',date:'',location:'',notes:''};
  save(); renderTab('shows');
}

function removeShow(id) {
  state.shows = state.shows.filter(s=>s.id!==id);
  // Clean up assignments in ALL containers since shows are shared
  state.containers.forEach(c => {
    if (c.data.assignments) c.data.assignments = c.data.assignments.filter(a=>a.showId!==id);
    if (c.data.shellAssignments) c.data.shellAssignments = c.data.shellAssignments.filter(a=>a.showId!==id);
  });
  // Also update current active data
  state.data.assignments = state.data.assignments.filter(a=>a.showId!==id);
  if (state.data.shellAssignments) state.data.shellAssignments = state.data.shellAssignments.filter(a=>a.showId!==id);
  if (state.selectedShow===id) state.selectedShow=null;
  save(); renderTab('shows');
}

function updateShowStatus(id, status) {
  const sh = state.shows.find(x=>x.id===id);
  if (sh) sh.status = status;
  save(); renderTab('shows');
}

function openShowDetail(id) {
  state.selectedShow = id;
  state.assignForm = {caseId:'',qty:'1'};
  state.assignErr = '';
  renderTab('shows');
}

function doAssign(showId) {
  const {caseId,qty} = state.assignForm;
  const n = parseInt(qty);
  if (!caseId) { state.assignErr='Select a case.'; renderTab('shows'); return; }
  if (!n||n<1) { state.assignErr='Enter a quantity.'; renderTab('shows'); return; }
  const c = state.data.cases.find(x=>String(x.id)===String(caseId));
  if (!c) { state.assignErr='Case not found.'; renderTab('shows'); return; }
  const already = state.data.assignments.filter(a=>String(a.caseId)===String(caseId)&&a.showId===showId).reduce((s,a)=>s+a.qty,0);
  if (already+n>c.remainingShells) { state.assignErr=`Only ${c.remainingShells-already} shells available.`; renderTab('shows'); return; }
  state.assignErr = '';

  const assignId = Date.now();
  state.data.assignments.push({id:assignId, showId, caseId:c.id, qty:n, assignedAt:new Date().toISOString()});

  // Also create individual shell assignments for the first N available shells in this case
  if (!state.data.shellAssignments) state.data.shellAssignments = [];
  const alreadyAssignedShellIds = new Set((state.data.shellAssignments||[]).filter(a=>a.showId===showId&&String(a.caseId)===String(caseId)).map(a=>a.shellId));
  const availShells = (state.data.shells||[]).filter(s=>String(s.caseId)===String(caseId)&&s.status!=='used'&&!alreadyAssignedShellIds.has(s.id));
  const toAssign = availShells.slice(0, n);
  const now2 = Date.now()+1;
  toAssign.forEach((sl, i) => {
    state.data.shellAssignments.push({id:now2+i, showId, shellId:sl.id, caseId:sl.caseId, bulkAssignId:assignId, assignedAt:new Date().toISOString()});
  });

  state.assignForm.qty = '1';
  save(); renderTab('shows');
}

function removeAssignment(id) {
  // Also remove any linked individual shell assignments that were created by this bulk assignment
  state.data.shellAssignments = (state.data.shellAssignments||[]).filter(a=>a.bulkAssignId!==id);
  state.data.assignments = state.data.assignments.filter(a=>a.id!==id);
  save(); renderTab('shows');
}

function updateAssignQty(id, delta) {
  const a = state.data.assignments.find(x=>x.id===id);
  if (!a) return;
  const c = state.data.cases.find(x=>x.id===a.caseId);
  const totalOther = state.data.assignments.filter(x=>x.caseId===a.caseId&&x.showId===a.showId&&x.id!==id).reduce((s,x)=>s+x.qty,0);
  const max = c ? c.remainingShells-totalOther : 999;
  const newQty = Math.max(1, Math.min(max, a.qty+delta));
  const diff = newQty - a.qty;
  a.qty = newQty;

  // Sync individual shell assignments for this bulk assignment
  if (!state.data.shellAssignments) state.data.shellAssignments = [];
  if (diff > 0) {
    // Add more individual shell assignments
    const alreadyIds = new Set((state.data.shellAssignments||[]).filter(sa=>sa.bulkAssignId===id).map(sa=>sa.shellId));
    const allAssigned = new Set((state.data.shellAssignments||[]).filter(sa=>sa.showId===a.showId&&sa.caseId===a.caseId).map(sa=>sa.shellId));
    const avail = (state.data.shells||[]).filter(s=>s.caseId===a.caseId&&s.status!=='used'&&!allAssigned.has(s.id));
    const toAdd = avail.slice(0, diff);
    const now3 = Date.now();
    toAdd.forEach((sl, i) => {
      state.data.shellAssignments.push({id:now3+i, showId:a.showId, shellId:sl.id, caseId:sl.caseId, bulkAssignId:id, assignedAt:new Date().toISOString()});
    });
  } else if (diff < 0) {
    // Remove |diff| individual shell assignments for this bulk assignment
    const linked = (state.data.shellAssignments||[]).filter(sa=>sa.bulkAssignId===id);
    const toRemove = new Set(linked.slice(linked.length + diff).map(sa=>sa.id));
    state.data.shellAssignments = state.data.shellAssignments.filter(sa=>!toRemove.has(sa.id));
  }

  save(); renderTab('shows');
}

function toggleShellSelect(shellId, checked) {
  if (!state.assignForm.selectedShells) state.assignForm.selectedShells = {};
  if (checked) state.assignForm.selectedShells[shellId] = true;
  else delete state.assignForm.selectedShells[shellId];
  // no re-render needed — checkboxes handle their own state
}

function assignSelectedShells(showId) {
  const selected = Object.keys(state.assignForm.selectedShells||{}).map(Number);
  if (!selected.length) { state.assignErr = 'Select at least one shell.'; renderTab('shows'); return; }
  const now = Date.now();
  selected.forEach((shellId, i) => {
    const sl = state.data.shells.find(x => x.id === shellId);
    if (!sl) return;
    // Don't double-assign
    const already = (state.data.shellAssignments||[]).find(a => a.shellId === shellId && a.showId === showId);
    if (already) return;
    if (!state.data.shellAssignments) state.data.shellAssignments = [];
    state.data.shellAssignments.push({
      id: now + i, showId, shellId, caseId: sl.caseId,
      assignedAt: new Date().toISOString()
    });
  });
  state.assignForm.selectedShells = {};
  state.assignForm.shellCaseId = '';
  state.assignErr = '';
  save(); renderTab('shows');
}

function removeShellAssignment(id) {
  state.data.shellAssignments = (state.data.shellAssignments||[]).filter(a => a.id !== id);
  save(); renderTab('shows');
}

// ── LOG TAB ────────────────────────────────────────────────────────────────
function renderLogTab() {
  const el = document.getElementById('panel-log');
  const {cases, shells} = state.data;
  const removalLog = state.data.removalLog || [];
  const {logSearch='', logType='', logDir=''} = state;

  // ── Build unified transaction list ────────────────────────────────────────
  const txns = [];

  // Case check-ins — skip isSingle (those show as shell check-ins below)
  cases.forEach(c => {
    if (c.isSingle) return;
    txns.push({
      _kind: 'in', _ref: 'case', _id: c.id,
      type: 'case', id: c.catalogNum, name: c.name,
      mfg: c.mfg||'', cls: c.cls, newW: c.newW, qty: c.totalShells,
      ts: c.createdAt || c.addedAt || '', shows: [], source: c.source||'manual',
    });
  });

  // Shell check-ins:
  // - For isSingle cases: show one shell entry (the unit itself)
  // - For regular cases: skip auto-logged shells (case check-in covers them)
  //   but show manually added individual shells
  shells.filter(s => s.addedAt).forEach(s => {
    const parentCase = cases.find(c => c.id === s.caseId);
    if (!parentCase) return;
    // For regular cases, skip shells that were auto-logged at case creation
    // (they're already represented by the case check-in)
    if (!parentCase.isSingle && !parentCase.isAssortment) return;
    txns.push({
      _kind: 'in', _ref: 'shell', _id: s.id,
      type: 'shell', id: s.shellNum, name: s.desc,
      mfg: parentCase.mfg||'', cls: parentCase.cls||'',
      newW: s.newW, qty: 1,
      ts: s.addedAt || '', shows: [],
      parentCatalog: parentCase.catalogNum||'', parentName: parentCase.name||'',
      source: parentCase.source||'manual',
    });
  });

  // Check-outs: from removalLog
  removalLog.forEach(e => {
    txns.push({
      _kind: 'out',
      _ref: e.type,
      _logId: e.id,
      type: e.type,
      id: e.type==='case' ? e.catalogNum : e.shellNum,
      name: e.type==='case' ? e.name : e.desc,
      mfg: e.mfg||'',
      cls: e.cls||'',
      newW: e.type==='case' ? e.newW*(e.remainingShells||0) : e.newW,
      qty: e.type==='case' ? (e.remainingShells||0) : 1,
      ts: e.removedAt || '',
      shows: e.shows||[],
      markedUsed: e.markedUsed,
      autoMarked: e.autoMarked,
      removedWithCase: e.removedWithCase,
      parentCatalog: e.parentCatalog||'',
      parentName: e.parentName||'',
    });
  });

  // Sort: newest first overall.
  // For case OUT entries, sort them AFTER all their shell OUT entries
  // by using max(shell timestamps) + 1 as the effective sort time.
  txns.sort((a, b) => {
    const effectiveTs = (t) => {
      if (t._kind === 'out' && t.type === 'case') {
        // Find the latest shell OUT that belongs to this case
        const shellTimes = txns
          .filter(x => x._kind === 'out' && x.type === 'shell' && x.parentCatalog === t.id)
          .map(x => new Date(x.ts || 0).getTime());
        const maxShell = shellTimes.length ? Math.max(...shellTimes) : 0;
        // Case sorts after its last shell
        return Math.max(new Date(t.ts || 0).getTime(), maxShell) + 1;
      }
      return new Date(t.ts || 0).getTime();
    };
    return effectiveTs(b) - effectiveTs(a);
  });

  // Filter
  const filtered = txns.filter(t => {
    const q = logSearch.toLowerCase();
    const ms = !q || (t.name||'').toLowerCase().includes(q)
      || (t.id||'').toLowerCase().includes(q)
      || (t.mfg||'').toLowerCase().includes(q)
      || (t.parentCatalog||'').toLowerCase().includes(q)
      || (t.parentName||'').toLowerCase().includes(q);
    const mt = !logType || t.type === logType;
    const md = !logDir  || t._kind === logDir;
    return ms && mt && md;
  });

  // Stats
  const checkIns  = txns.filter(t=>t._kind==='in');
  const checkOuts = txns.filter(t=>t._kind==='out');
  const totalNEWOut = checkOuts.reduce((s,t)=>s+(t.newW||0), 0);

  function tsDisplay(ts) {
    if (!ts) return '<span style="color:#333">—</span>';
    const d = new Date(ts);
    if (isNaN(d)) return '<span style="color:#555">Invalid</span>';
    return `<span style="font-family:var(--mono);font-size:12px;color:#e5e5e5">${d.toLocaleDateString()}</span>`;
  }

  function tsValue(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d)) return '';
    // Format for datetime-local input: YYYY-MM-DDTHH:mm
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  const rows = filtered.map((t, i) => {
    const dirBadge = t._kind === 'in'

function updateLogTs(kind, id, datetimeLocalValue) {
  const newTs = datetimeLocalValue ? new Date(datetimeLocalValue).toISOString() : null;
  if (!newTs) return;
  // Use string comparison — IDs may be floats that lose precision through JSON serialization
  const sid = String(id);

  if (kind === 'removal') {
    const entry = (state.data.removalLog||[]).find(e => String(e.id) === sid);
    if (entry) entry.removedAt = newTs;
  } else if (kind === 'case') {
    const c = state.data.cases.find(x => String(x.id) === sid);
    if (c) { c.createdAt = newTs; c.addedAt = newTs; }
  } else if (kind === 'shell') {
    const s = state.data.shells.find(x => String(x.id) === sid);
    if (s) s.addedAt = newTs;
  } else if (kind === 'shellused') {
    const s = state.data.shells.find(x => String(x.id) === sid);
    if (s) s.usedAt = newTs;
  }
  save();
}

function clearLogEntry(id) {
  state.data.removalLog = (state.data.removalLog||[]).filter(e=>e.id!==id);
  save(); renderTab('log');
}
function clearAllLog() {
  // confirm() is blocked in sandboxed iframes — use inline confirmation via state flag
  if (!state.clearLogConfirm) {
    state.clearLogConfirm = true;
    renderTab('log');
    return;
  }
  state.clearLogConfirm = false;
  state.data.removalLog = [];
  save(); renderTab('log');
}
function cancelClearLog() {
  state.clearLogConfirm = false;
  renderTab('log');
}

function addStandaloneShell() {
  const sf = state.addShellForm;
  if (!sf || !sf.desc?.trim()) {
    document.getElementById('as-desc')?.focus();
    return;
  }
  const caseId = parseFloat(sf.caseId) || state.data.cases[0]?.id;
  if (!caseId) return;
  const parentCase = state.data.cases.find(c=>c.id===caseId);
  const newWOz = sf.newW ? parseFloat(sf.newW)*16 : (parentCase?.newW || 0.5);
  const checkinTs = sf.checkinDate ? new Date(sf.checkinDate).toISOString() : new Date().toISOString();

  const shell = {
    id: Date.now(), caseId,
    shellNum: nextShellNum(caseId),
    desc: sf.desc.trim(),
    newW: newWOz,
    notes: sf.notes?.trim()||'',
    status: 'intact',
    addedAt: checkinTs,
  };
  state.data.shells.push(shell);

  // Increment case remaining count
  if (parentCase) {
    parentCase.totalShells += 1;
    parentCase.remainingShells += 1;
  }

  const lastAdded = shell.shellNum;
  state.addShellForm = {
    caseId: String(caseId),
    desc: '', newW: sf.newW, notes: '',
    checkinDate: sf.checkinDate,
    _lastAdded: lastAdded
  };
  save();
  renderTab('addshell');
}
