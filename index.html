// Convert FC (compact Finale catalog) entries to catalog-item shape
function fcItems() {
  return (FC||[]).map(p => ({
    sku: p.s, name: p.n, mfg: p.m, cls: p.c,
    productType: p.t, size: p.z, cat: p.g, mfgPn: p.p,
    _finale: true
  }));
}






// ── Invoice Import ─────────────────────────────────────────────────────────
// state.invoice = { status:'idle'|'parsing'|'review'|'done', lines:[], error:'' }

function renderInvoiceTab() {
  const el = document.getElementById('panel-invoice');
  if (!el) return;
  const inv = state.invoice || {status:'idle', lines:[], error:''};

  if (inv.status === 'idle' || inv.status === 'error') {
    el.innerHTML = `
      <div class="sec">Import Invoice</div>
      <div class="card-pad" style="max-width:700px">
        <p style="font-size:13px;color:#888;margin:0 0 16px">Drop a PDF or image of your fireworks invoice. Claude will read the line items, match each one against the product catalog, and give you a review table to confirm before adding to your inventory.</p>
        <div id="inv-drop" style="border:2px dashed #2a2a2a;border-radius:10px;padding:48px 32px;text-align:center;cursor:pointer;transition:border-color .15s"
          ondragover="event.preventDefault();this.style.borderColor='#d97706'"
          ondragleave="this.style.borderColor='#2a2a2a'"
          ondrop="invoiceDrop(event)"
          onclick="document.getElementById('inv-file-input').click()">
          <div style="font-size:36px;margin-bottom:10px">📄</div>
          <div style="font-size:15px;font-weight:700;color:#e5e5e5">Drop invoice PDF or image here</div>
          <div style="font-size:12px;color:#555;margin-top:6px">or click to browse · PDF, PNG, JPG, WEBP</div>
        </div>
        <input id="inv-file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" style="display:none" onchange="invoiceFileChosen(this)">
        ${inv.error ? `
          <div class="err-txt" style="margin-top:16px;padding:12px 16px;border-radius:6px;background:#1a0500;border:1px solid #7f1d1d">
            <div style="font-weight:700;color:#fca5a5;margin-bottom:4px">⚠ Error</div>
            <div style="font-size:12px;color:#fca5a5;word-break:break-word">${esc(inv.error)}</div>
            <div style="font-size:11px;color:#555;margin-top:8px">Check the browser console (F12) for more detail.</div>
          </div>` : ''}
      </div>`;
    return;
  }

  if (inv.status === 'parsing') {
    el.innerHTML = `
      <div class="sec">Import Invoice</div>
      <div class="card-pad" style="max-width:600px">
        <div style="display:flex;align-items:center;gap:14px;padding:24px 0">
          <div style="width:28px;height:28px;border:3px solid #d97706;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0"></div>
          <div>
            <div style="font-weight:700;color:#e5e5e5;margin-bottom:4px">Reading invoice…</div>
            <div style="font-size:12px;color:#555">${esc(inv.parseStep||'Extracting line items and matching against catalog…')}</div>
          </div>
        </div>
      </div>`;
    return;
  }

  if (inv.status === 'review') {
    const lines = inv.lines || [];
    const allCatalog = [...(FC||[]).map(p=>({sku:p.s,name:p.n,mfg:p.m,cls:p.c,productType:p.t,size:p.z,cat:p.g,mfgPn:p.p,_finale:true})),
                        ...RACCOON_CATALOG, ...WIZARD_CATALOG];

    const rows = lines.map((ln, i) => {
      const checked = ln.include !== false;
      const match = ln.match; // catalog item if found
      const clsOpts = ATF_CLASSES.map(c=>`<option value="${c.value}"${(ln.cls||'1D')===c.value?' selected':''}>${c.label}</option>`).join('');
      const typeOpts = PRODUCT_TYPES.map(t=>`<option value="${t}"${(ln.productType||'Shell')===t?' selected':''}>${t}</option>`).join('');

      return `<tr style="opacity:${checked?1:0.4};background:${match?'':'#1a0a00'}">
        <td style="text-align:center">
          <input type="checkbox" ${checked?'checked':''} onchange="invoiceLineToggle(${i},this.checked)" style="width:15px;height:15px;accent-color:#d97706">
        </td>
        <td style="font-size:12px;color:#888;font-family:var(--mono)">${esc(ln.rawLine||'')}</td>
        <td>
          ${match
            ? `<div style="font-size:11px;color:#86efac;font-weight:700">✓ MATCHED</div>
               <div style="font-family:var(--mono);font-size:11px;color:#fbbf24">${esc(match.sku||match.s||'')}</div>
               <div style="font-size:12px;color:#e5e5e5">${esc(match.name||match.n||'')}</div>
               <div style="font-size:11px;color:#555">${esc(match.mfg||match.m||'')} · ${esc(match.cat||match.g||'')}</div>`
            : `<div style="font-size:11px;color:#fca5a5;font-weight:700">⚠ NO MATCH — edit below</div>`}
        </td>
        <td><input class="edit-input" style="width:100%" value="${esc(ln.name||'')}" oninput="invoiceLineEdit(${i},'name',this.value)" placeholder="Description*"></td>
        <td><input class="edit-input" style="width:70px;font-family:var(--mono)" value="${esc(ln.exNum||'')}" oninput="invoiceLineEdit(${i},'exNum',this.value)" placeholder="EX #"></td>
        <td><select class="edit-input" style="height:28px" onchange="invoiceLineEdit(${i},'cls',this.value)">${clsOpts}</select></td>
        <td><select class="edit-input" style="height:28px;min-width:90px" onchange="invoiceLineEdit(${i},'productType',this.value)">${typeOpts}</select></td>
        <td><input class="edit-input" style="width:60px;font-family:var(--mono)" value="${esc(ln.size||'')}" oninput="invoiceLineEdit(${i},'size',this.value)" placeholder='size'></td>
        <td><input class="edit-input" type="number" style="width:55px" value="${esc(String(ln.qty||1))}" oninput="invoiceLineEdit(${i},'qty',this.value)" min="1" title="Cases ordered"></td>
        <td>
          <div style="display:flex;flex-direction:column;gap:3px">
            <input class="edit-input" style="width:60px;font-family:var(--mono);font-size:11px" value="${esc(ln.packing||'')}" oninput="invoiceLineEdit(${i},'packing',this.value)" placeholder="e.g. 6/1" title="Packing from invoice">
            <input class="edit-input" type="number" style="width:60px" value="${esc(String(ln.unitsPerCase||''))}" oninput="invoiceLineEdit(${i},'unitsPerCase',this.value)" placeholder="units" min="1" title="Units per case (auto-parsed from packing)">
          </div>
        </td>
        <td><input class="edit-input" type="number" style="width:65px" value="${esc(String(ln.newW||''))}" oninput="invoiceLineEdit(${i},'newW',this.value)" placeholder="lb/unit"></td>
        <td><input class="edit-input" type="number" style="width:65px" value="${esc(String(ln.unitCost||''))}" oninput="invoiceLineEdit(${i},'unitCost',this.value)" placeholder="$/case"></td>
      </tr>`;
    }).join('');

    const readyCount = lines.filter(l=>l.include!==false && l.name).length;

    el.innerHTML = `
      <div class="sec" style="display:flex;align-items:center;justify-content:space-between">
        <span>Review Invoice — <span style="color:#fbbf24;font-weight:700">${lines.filter(l=>l.match).length}/${lines.length}</span> matched in catalog</span>
        <div style="display:flex;gap:8px">
          <button class="btn-sm" onclick="invoiceReset()">↩ Start over</button>
          <button class="btn-primary" onclick="invoiceImport()" ${readyCount<1?'disabled':''} style="font-size:12px">
            ✓ Add ${readyCount} item${readyCount!==1?'s':''} to inventory
          </button>
        </div>
      </div>
      <div class="card" style="overflow-x:auto">
        <table style="font-size:12px">
          <colgroup>
            <col style="width:3%"><col style="width:12%"><col style="width:14%">
            <col style="width:13%"><col style="width:6%"><col style="width:6%"><col style="width:7%">
            <col style="width:5%"><col style="width:4%"><col style="width:8%"><col style="width:7%"><col style="width:7%">
          </colgroup>
          <thead><tr>
            <th>✓</th><th>Raw invoice line</th><th>Catalog match</th>
            <th>Description</th><th>EX #</th><th>Class</th><th>Type</th>
            <th>Size</th><th>Cases</th><th>Packing / Units/case</th><th>NEW/unit (lb)</th><th>$/case</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    return;
  }

  if (inv.status === 'done') {
    el.innerHTML = `
      <div class="sec">Import Invoice</div>
      <div class="card-pad">
        <div style="font-size:32px;margin-bottom:10px">✅</div>
        <div style="font-weight:700;color:#86efac;font-size:16px;margin-bottom:8px">${inv.addedCount||0} product${(inv.addedCount||0)!==1?'s':''} added to inventory</div>
        <div style="font-size:13px;color:#555;margin-bottom:20px">All items have been added to the active container: <strong style="color:#fbbf24">${esc(state.containers.find(c=>c.id===state.activeContainerId)?.name||'')}</strong></div>
        <div style="display:flex;gap:8px">
          <button class="btn-primary" onclick="switchTab('cases')">View inventory</button>
          <button class="btn-sm" onclick="invoiceReset()">Import another</button>
        </div>
      </div>`;
    return;
  }
}

async function invoiceProcess(file) {
  const allowed = ['application/pdf','image/png','image/jpeg','image/webp','image/jpg'];
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if (!isImage && !isPdf) {
    state.invoice = {status:'error', lines:[], error:'Unsupported file type. Please use PDF, PNG, JPG, or WEBP.'};
    renderTab('invoice'); return;
  }

  state.invoice = {status:'parsing', lines:[], parseStep:'Reading file…'};
  renderTab('invoice');

  try {
    // Convert file to base64
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = () => rej(new Error('Failed to read file'));
      r.readAsDataURL(file);
    });

    state.invoice.parseStep = 'Sending to Claude for extraction…';
    renderTab('invoice');

    const mediaType = file.type === 'image/jpg' ? 'image/jpeg' : file.type;

    // Keep prompt concise — no inline catalog (we match locally after)
    const prompt = `You are reading a fireworks invoice or purchase order. Extract every product line item and return ONLY a valid JSON array with no markdown fences.

Each element must have:
{
  "rawLine": "exact text from invoice",
  "sku": "part number or product code if shown, else null",
  "name": "product name or description",
  "mfg": "manufacturer if shown, else null",
  "qty": <integer number of CASES ordered, default 1>,
  "packing": "packing string exactly as shown on invoice e.g. 6/1, 12/1, 24/6, 4/1 — this means units-per-case/cases. If not shown use null",
  "unitsPerCase": <integer units (shells/tubes/pieces) inside ONE case from the packing. E.g. packing 6/1 means 6 units per case. packing 24/6 means 24 units per case. If unknown use null>,
  "unitCost": <price per CASE as number if shown, else null>,
  "exNum": "EX number if shown, else null",
  "cls": "1C" for 1.3G Class B, "1D" for 1.4G Class C or Pro, else "1D",
  "productType": one of: Shell|Mine|Comet|Cake|Fountain|Ground Effect|Roman Candle|Mortar|Aerial Repeater|Strobe|Gerb|Lance|Wheel|Chain|Assortment|Other,
  "size": "caliber like 3in or 25mm if shown, else null",
  "newW": <NET explosive weight per unit/shell in POUNDS as number if shown, else null>
}

Packing interpretation guide:
- "6/1" = 6 units per case, 1 case per master = unitsPerCase:6
- "12/1" = 12 units per case = unitsPerCase:12
- "24/6" = 24 shells per tube, 6 tubes per case = unitsPerCase:24 (first number is units inside)
- "4/1" = 4 units per case = unitsPerCase:4
- "cs 5" or "case of 5" = unitsPerCase:5

Skip header rows, shipping lines, tax lines, and non-product rows.
Return ONLY the JSON array.`;

    // Build content — image or PDF
    const contentParts = isPdf
      ? [
          {type:'document', source:{type:'base64', media_type:'application/pdf', data:b64}},
          {type:'text', text:prompt}
        ]
      : [
          {type:'image', source:{type:'base64', media_type:mediaType, data:b64}},
          {type:'text', text:prompt}
        ];

    // PDF needs the pdfs beta header
    const headers = {'Content-Type':'application/json'};
    if (isPdf) headers['anthropic-beta'] = 'pdfs-2024-09-25';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers,
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:8000,
        messages:[{role:'user', content:contentParts}]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || `API error ${response.status}: ${JSON.stringify(data).slice(0,200)}`);
    }

    const rawText = data.content?.find(b=>b.type==='text')?.text || '';
    if (!rawText) throw new Error('Claude returned an empty response. Check the file and try again.');

    state.invoice.parseStep = 'Matching against catalog…';
    renderTab('invoice');

    // Parse JSON — strip markdown fences, handle truncation
    let parsed;
    try {
      const clean = rawText.replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'').trim();

      // If the JSON array is truncated (common with large invoices), close it gracefully
      let jsonStr = clean;
      if (!jsonStr.endsWith(']')) {
        // Find the last complete object (ends with }) and close the array
        const lastBrace = jsonStr.lastIndexOf('}');
        if (lastBrace !== -1) {
          jsonStr = jsonStr.slice(0, lastBrace + 1) + ']';
        } else {
          jsonStr = jsonStr + ']'; // try anyway
        }
      }

      parsed = JSON.parse(jsonStr);
      if (!Array.isArray(parsed)) {
        const keys = Object.keys(parsed);
        const arr = parsed[keys[0]];
        if (Array.isArray(arr)) parsed = arr;
        else throw new Error('not an array');
      }
    } catch(e) {
      // Last resort: extract all complete JSON objects from the text
      const objects = [];
      const objRegex = /\{[^{}]*(?:\{[^{}]*\}[^{}]*)?\}/g;
      let m;
      while ((m = objRegex.exec(rawText)) !== null) {
        try { objects.push(JSON.parse(m[0])); } catch {}
      }
      if (objects.length > 0) {
        parsed = objects;
      } else {
        throw new Error(`Could not parse response. Raw text: ${rawText.slice(0,400)}`);
      }
    }

    // Build catalog lookup maps (SKU → item)
    const catalogMap = {};
    (FC||[]).forEach(p => {
      catalogMap[p.s.toLowerCase()] = p;
      if (p.p) catalogMap[p.p.toLowerCase()] = p; // also index by mfg part number
    });
    RACCOON_CATALOG.forEach(p => { if(p.sku) catalogMap[p.sku.toLowerCase()] = p; });
    WIZARD_CATALOG.forEach(p => { if(p.sku) catalogMap[p.sku.toLowerCase()] = p; });

    // Pre-build name index for fuzzy matching
    const nameIndex = (FC||[]).map(p => ({item:p, words:p.n.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(' ').filter(w=>w.length>3)}));

    function fuzzyMatch(name) {
      if (!name) return null;
      const q = name.toLowerCase().replace(/[^a-z0-9 ]/g,' ');
      const qWords = q.split(' ').filter(w=>w.length>3);
      if (!qWords.length) return null;

      let best = null, bestScore = 0;
      for (const {item, words} of nameIndex) {
        const hits = qWords.filter(w => words.includes(w)).length;
        const score = hits / Math.max(qWords.length, words.length);
        if (score > bestScore && score >= 0.4) { bestScore = score; best = item; }
      }
      return best;
    }

    // Parse packing string like "6/1", "24/6", "cs 5" → unitsPerCase
    function parsePacking(packing, fallbackUnits) {
      if (fallbackUnits) return parseInt(fallbackUnits);
      if (!packing) return null;
      const p = String(packing).trim();
      // Match "24/6", "6/1", "12/2" etc — first number is units per case
      const slashMatch = p.match(/^(\d+)\s*\/\s*\d+/);
      if (slashMatch) return parseInt(slashMatch[1]);
      // Match "cs 5", "case of 5", "case 5"
      const csMatch = p.match(/cs\s*(\d+)|case\s+of\s+(\d+)|case\s*(\d+)/i);
      if (csMatch) return parseInt(csMatch[1]||csMatch[2]||csMatch[3]);
      // Plain number
      const plain = parseInt(p);
      if (!isNaN(plain) && plain > 0) return plain;
      return null;
    }

    // Match each line to catalog
    const lines = parsed
      .filter(item => item && (item.name || item.sku))
      .map(item => {
        let match = null;

        // 1. Exact SKU lookup
        const skuKey = (item.sku||'').toLowerCase().trim();
        if (skuKey && catalogMap[skuKey]) match = catalogMap[skuKey];

        // 2. Fuzzy name match
        if (!match) match = fuzzyMatch(item.name);

        // Pull fields from catalog match (FC compact format)
        const fc = match && match.s ? match : null;
        const bi = match && !match.s ? match : null;

        const unitsPerCase = parsePacking(item.packing, item.unitsPerCase);

        return {
          rawLine:     item.rawLine || '',
          sku:         item.sku || (fc?.s) || (bi?.sku) || '',
          name:        item.name || (fc?.n) || (bi?.name) || '',
          mfg:         item.mfg || (fc?.m) || (bi?.mfg) || '',
          cls:         item.cls || (fc?.c) || (bi?.cls) || '1D',
          productType: item.productType || (fc?.t) || (bi?.productType) || 'Shell',
          size:        item.size || (fc?.z) || (bi?.size) || '',
          exNum:       item.exNum || '',
          qty:         Math.max(1, parseInt(item.qty)||1),
          packing:     item.packing || '',
          unitsPerCase: unitsPerCase,
          newW:        item.newW    ? parseFloat(item.newW)    : null,
          unitCost:    item.unitCost ? parseFloat(item.unitCost) : null,
          match:       match || null,
          include:     true,
        };
      });

    if (!lines.length) throw new Error('No product line items found in this document. Try a clearer image or check that it\'s a fireworks invoice.');

    state.invoice = {status:'review', lines, error:''};
    renderTab('invoice');

  } catch(err) {
    console.error('Invoice import error:', err);
    state.invoice = {status:'error', lines:[], error: String(err.message||err)};
    renderTab('invoice');
  }
}

function invoiceLineToggle(i, checked) {
  if (state.invoice?.lines?.[i]) {
    state.invoice.lines[i].include = checked;
    renderTab('invoice');
  }
}

function invoiceLineEdit(i, field, value) {
  if (!state.invoice?.lines?.[i]) return;
  state.invoice.lines[i][field] = value;
  // Auto-parse packing string → unitsPerCase
  if (field === 'packing' && value) {
    const slashMatch = value.match(/^(\d+)\s*\/\s*\d+/);
    const csMatch = value.match(/cs\s*(\d+)|case\s+of\s+(\d+)|case\s*(\d+)/i);
    const plain = parseInt(value);
    if (slashMatch) state.invoice.lines[i].unitsPerCase = parseInt(slashMatch[1]);
    else if (csMatch) state.invoice.lines[i].unitsPerCase = parseInt(csMatch[1]||csMatch[2]||csMatch[3]);
    else if (!isNaN(plain) && plain > 0) state.invoice.lines[i].unitsPerCase = plain;
    // Re-render to show updated unitsPerCase
    renderTab('invoice');
    return;
  }
  // Update the Add button count without full re-render
  const btn = document.querySelector('#panel-invoice .btn-primary');
  if (btn) {
    const readyCount = state.invoice.lines.filter(l=>l.include!==false && l.name).length;
    btn.textContent = `✓ Add ${readyCount} item${readyCount!==1?'s':''} to inventory`;
    btn.disabled = readyCount < 1;
  }
}

function invoiceImport() {
  const lines = (state.invoice?.lines||[]).filter(l=>l.include!==false && l.name);
  if (!lines.length) return;

  let added = 0;
  lines.forEach(ln => {
    const casesOrdered = Math.max(1, parseInt(ln.qty)||1);
    const unitsPerCase = parseInt(ln.unitsPerCase)||null;
    const totalShells = unitsPerCase || 1; // units per case = shells in this case
    // newW in lbs → oz
    const newWOz = ln.newW ? parseFloat(ln.newW)*16 : 0;
    // unitCost is cost per case; store as caseCost
    const caseCost = ln.unitCost ? parseFloat(ln.unitCost) : null;

    // Create one case record per case ordered
    for (let c = 0; c < casesOrdered; c++) {
      const newCase = {
        id: Date.now() + Math.random(),
        catalogNum: genId('case'),
        name: (ln.name||'').trim(),
        mfg: (ln.mfg||'').trim(),
        cls: ln.cls||'1D',
        productType: ln.productType||'Shell',
        shellSize: ln.size||extractShellSize(ln.name||''),
        exNum: ln.exNum||null,
        caseCost: caseCost,
        newW: newWOz,
        isChain: false, isAssortment: false,
        totalShells: totalShells,
        remainingShells: totalShells,
        packingStr: ln.packing||null,
        show: '',
        status: 'sealed',
        source: 'invoice',
        createdAt: new Date().toISOString()
      };
      state.data.cases.push(newCase);
      autoLogShells(newCase);
      added++;
    }
  });

  save();
  state.invoice = {status:'done', lines:[], addedCount:added};
  renderTab('invoice');
  render();
}

function buildLabelData() {
  const cases  = state.data.cases;
  const shells = state.data.shells;
  const caseSel   = document.getElementById('case-sel');
  const shellSel  = document.getElementById('shell-sel');
  const caseCopies  = document.getElementById('case-copies-check')?.checked ? (parseInt(document.getElementById('case-copies-n')?.value)||1) : 1;
  const shellCopies = document.getElementById('shell-copies-check')?.checked ? (parseInt(document.getElementById('shell-copies-n')?.value)||1) : 1;
  const showMfg  = document.getElementById('lbl-show-mfg')?.checked;
  const showCls  = document.getElementById('lbl-show-class')?.checked;
  const showNew  = document.getElementById('lbl-show-new')?.checked;
  const showEx   = document.getElementById('lbl-show-ex')?.checked;
  const showCont = document.getElementById('lbl-show-container')?.checked;
  const containerName = state.containers.find(c=>c.id===state.activeContainerId)?.name || '';
  const CLASS_LABEL = {'1C':'1.3G Class B','1D':'1.4G Class C','other':'Other'};

  const selCaseIds  = caseSel  ? [...caseSel.options].filter(o=>o.selected).map(o=>parseFloat(o.value))  : [];
  const selShellIds = shellSel ? [...shellSel.options].filter(o=>o.selected).map(o=>parseFloat(o.value)) : [];

  const labels = [];

  selCaseIds.forEach(id => {
    const c = cases.find(x=>x.id===id);
    if (!c) return;
    for (let i=0; i<caseCopies; i++) {
      const lines = [];
      lines.push({text: c.catalogNum,   size:'13px', weight:'700', mono:true, color:'#000'});
      lines.push({text: c.name,         size:'9px',  weight:'600', color:'#111', wrap:true});
      if (showMfg && c.mfg) lines.push({text: c.mfg, size:'8px', color:'#444'});
      const meta = [];
      if (c.shellSize) meta.push(c.shellSize);
      if (showCls) meta.push(CLASS_LABEL[c.cls]||c.cls);
      if (showEx && c.exNum) meta.push('EX: '+c.exNum);
      if (showNew && c.newW) meta.push(lbs(c.newW)+' lbs/unit');
      if (meta.length) lines.push({text: meta.join('  ·  '), size:'8px', color:'#555'});
      const meta2 = [];
      if (showCont && containerName) meta2.push(containerName);
      meta2.push(c.totalShells+' units');
      lines.push({text: meta2.join('  ·  '), size:'8px', color:'#666'});
      labels.push({lines, type:'case'});
    }
  });

  selShellIds.forEach(id => {
    const s = shells.find(x=>x.id===id);
    if (!s) return;
    const pc = cases.find(x=>x.id===s.caseId);
    for (let i=0; i<shellCopies; i++) {
      const lines = [];
      lines.push({text: s.shellNum, size:'13px', weight:'700', mono:true, color:'#000'});
      lines.push({text: s.desc,     size:'9px',  weight:'600', color:'#111', wrap:true});
      if (pc) {
        if (showMfg && pc.mfg) lines.push({text: pc.mfg, size:'8px', color:'#444'});
        const meta = [];
        if (pc.shellSize) meta.push(pc.shellSize);
        if (showCls) meta.push(CLASS_LABEL[pc.cls]||pc.cls);
        if (showEx && pc.exNum) meta.push('EX: '+pc.exNum);
        if (showNew && s.newW) meta.push(lbs(s.newW)+' lbs');
        if (meta.length) lines.push({text: meta.join('  ·  '), size:'8px', color:'#555'});
      }
      if (showCont && containerName) lines.push({text: containerName, size:'8px', color:'#666'});
      labels.push({lines, type:'shell'});
    }
  });

  return labels;
}

function updateLabelPreview() {
  const labels = buildLabelData();
  const preview = document.getElementById('lbl-preview');
  const countEl = document.getElementById('lbl-count');
  if (!preview) return;

  // Ensure start position picker exists and is up to date
  renderStartPicker(labels.length);

  if (!labels.length) {
    preview.innerHTML = '<div style="color:#999;font-size:12px;font-family:Arial,sans-serif;text-align:center;padding:40px 0">Select cases or shells on the left to see label preview</div>';
    if (countEl) countEl.textContent = '— select items to preview';
    return;
  }

  const startPos = window._lblStartPos || 0; // 0-based index into the 30-slot sheet
  const totalSlots = startPos + labels.length;
  const sheets = Math.ceil(totalSlots / 30);
  if (countEl) countEl.textContent = `— ${labels.length} label${labels.length!==1?'s':''} · starts at slot ${startPos+1} · ${sheets} sheet${sheets!==1?'s':''}`;

  // Build preview: blank slots then label slots
  let cells = '';
  for (let i = 0; i < startPos; i++) {
    cells += `<div style="width:158px;height:60px;border:1px dashed #ddd;background:#f0f0f0;flex-shrink:0;display:flex;align-items:center;justify-content:center"><span style="font-size:9px;color:#bbb;font-family:Arial">used</span></div>`;
  }
  labels.forEach(({lines, type}) => {
    const inner = lines.map(l =>
      `<div style="font-size:${l.size};font-weight:${l.weight||'400'};color:${l.color||'#000'};font-family:${l.mono?'monospace':'Arial,sans-serif'};line-height:1.15;${l.wrap?'white-space:normal;word-break:break-word;':'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'}">${esc(l.text)}</div>`
    ).join('');
    const borderColor = type==='case' ? '#d97706' : '#3b82f6';
    cells += `<div style="width:158px;min-height:60px;padding:4px 6px;border:1px solid #ccc;border-left:3px solid ${borderColor};background:#fff;display:flex;flex-direction:column;justify-content:center;overflow:hidden;flex-shrink:0">${inner}</div>`;
  });
  // Pad to fill last row
  const total = startPos + labels.length;
  const rem = total % 3;
  const padCount = rem === 0 ? 0 : 3 - rem;
  for (let i = 0; i < padCount; i++) {
    cells += `<div style="width:158px;height:60px;border:1px dashed #e5e5e5;background:#fafafa;flex-shrink:0"></div>`;
  }

  preview.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,158px);gap:2px;font-family:Arial,sans-serif">
      ${cells}
    </div>
    <div style="margin-top:8px;font-size:10px;color:#999;font-family:Arial,sans-serif;text-align:right">
      Orange = case &nbsp;·&nbsp; Blue = shell &nbsp;·&nbsp; Gray = skipped (already used)
    </div>`;
}

function renderStartPicker(labelCount) {
  const container = document.getElementById('lbl-start-picker');
  if (!container) return;
  if (window._lblStartPos === undefined) window._lblStartPos = 0;
  const cur = window._lblStartPos;

  // 3×10 grid of slots — click to set start position
  // Slots that would go past 30 are disabled (can't start there)
  let html = '<div style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#888;margin-bottom:6px">Start position on sheet <span style="font-weight:400;color:#555;text-transform:none;letter-spacing:0">(click to set first label)</span></div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:180px">';
  for (let i = 0; i < 30; i++) {
    const isCur = i === cur;
    const isDisabled = labelCount > 0 && i + labelCount > 30 && i > 0;
    const col = isCur ? '#d97706' : isDisabled ? '#1a1a1a' : '#1e1e1e';
    const txtCol = isCur ? '#000' : isDisabled ? '#333' : '#666';
    const border = isCur ? '1px solid #d97706' : '1px solid #2a2a2a';
    html += `<div onclick="${isDisabled ? '' : `window._lblStartPos=${i};updateLabelPreview()`}" 
      style="height:16px;background:${col};border:${border};border-radius:2px;cursor:${isDisabled?'default':'pointer'};display:flex;align-items:center;justify-content:center;font-size:8px;font-family:monospace;color:${txtCol};user-select:none"
      title="Start at label ${i+1}">${i+1}</div>`;
  }
  html += '</div>';
  html += `<div style="margin-top:5px;font-size:10px;color:#555">Starting at label <strong style="color:#d97706">${cur+1}</strong> of 30</div>`;
  container.innerHTML = html;
}

function closeLabelModal() {
  const m = document.getElementById('label-modal');
  if (!m) return;
  m.style.display = 'none';
  const inner = m.querySelector('div');
  if (inner) inner.style.width = '';
  window._lblStartPos = 0;
}

function labelSelectAll(selId) {
  const sel = document.getElementById(selId);
  if (sel) { [...sel.options].forEach(o=>o.selected=true); updateLabelPreview(); }
}
function labelSelectNone(selId) {
  const sel = document.getElementById(selId);
  if (sel) { [...sel.options].forEach(o=>o.selected=false); updateLabelPreview(); }
}

<title>Labels — Avery 5620</title>
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #fff; }
  .sheet {

    padding-top: 0.5in;
    padding-left: 0.1875in;
    display: grid;
    grid-template-columns: repeat(3, 2.625in);
    grid-template-rows: repeat(10, 1in);
    column-gap: 0.125in;
    row-gap: 0;
  }
  .lbl {
    width: 2.625in;
    height: 1in;
    padding: 5pt 8pt;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @media print { .no-print { display: none !important; } }
</style>
</head><body>
<div class="no-print" style="padding:10px 16px;background:#f5f5f5;border-bottom:1px solid #ddd;font-family:Arial;font-size:13px;display:flex;gap:12px;align-items:center">
  <button onclick="window.print()" style="margin-left:auto;background:#d97706;color:#fff;border:none;padding:6px 18px;border-radius:5px;font-size:13px;font-weight:700;cursor:pointer">🖨 Print</button>
  <button onclick="window.close()" style="background:#eee;border:1px solid #ccc;padding:6px 14px;border-radius:5px;font-size:13px;cursor:pointer">Close</button>

<\/body><\/html>`;

  const blob = new Blob([html], {type:'text/html'});

// ── Export Show Data ──────────────────────────────────────────────────────
function exportShowData() {
  const shows = state.shows;
  const {cases, shells, assignments} = state.data;
  const shellAssignments = state.data.shellAssignments||[];
  const date = new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
  const wb = XLSX.utils.book_new();

  // ── Sheet 1: Shows Summary ──
  const summaryHeader = ['Show Name','Date','Location','Status','Notes','Cases Used','Shells Assigned','Total NEW (lbs)','Containers'];
  const summaryRows = shows.map(sh => {
    const shAssign = assignments.filter(a=>a.showId===sh.id);
    const shShellA = shellAssignments.filter(a=>a.showId===sh.id&&!a.bulkAssignId);
    const shNEW = shAssign.reduce((s,a)=>{const c=cases.find(x=>x.id===a.caseId);return s+(c?a.qty*c.newW:0);},0)
      + shShellA.reduce((s,a)=>{const sl=shells.find(x=>x.id===a.shellId);return s+(sl?sl.newW:0);},0);
    const shShells = shAssign.reduce((s,a)=>s+a.qty,0)+shShellA.length;
    const shCases = new Set([...shAssign.map(a=>a.caseId),...shShellA.map(a=>a.caseId)]).size;
    // Which containers have shells assigned to this show
    const containerNames = [...new Set(
      state.containers.filter(cont => {
        const ca = (cont.data.assignments||[]).some(a=>a.showId===sh.id);
        const csa = (cont.data.shellAssignments||[]).some(a=>a.showId===sh.id);
        return ca||csa;
      }).map(c=>c.name)
    )].join('; ');
    return [
      sh.name, sh.date||'', sh.location||'',
      (SHOW_STATUS[sh.status]||{label:sh.status}).label,
      sh.notes||'',
      shCases, shShells,
      parseFloat(lbs(shNEW)),
      containerNames||'—'
    ];
  });
  const ws1 = XLSX.utils.aoa_to_sheet([
    [`Show Data Export — ${date}`],[],
    summaryHeader, ...summaryRows
  ]);
  ws1['!cols'] = [28,12,20,12,28,10,12,14,24].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws1, 'Shows Summary');

  // ── Sheet 2: Case Assignments (per show, per container) ──
  const caseAssignHeader = ['Show Name','Show Date','Container','Catalog #','Case Description','ATF Class','Manufacturer','Shells Assigned','NEW (lbs)','Assigned On'];
  const caseAssignRows = [];
  state.containers.forEach(cont => {
    (cont.data.assignments||[]).forEach(a => {
      const sh = shows.find(x=>x.id===a.showId);
      const c = cont.data.cases.find(x=>x.id===a.caseId);
      if (!sh||!c) return;
      caseAssignRows.push([
        sh.name, sh.date||'', cont.name,
        c.catalogNum, c.name,
        CLASS_LABELS[c.cls]||c.cls, c.mfg||'',
        a.qty, parseFloat(lbs(a.qty*c.newW)),
        a.assignedAt ? new Date(a.assignedAt).toLocaleDateString() : ''
      ]);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet([caseAssignHeader, ...caseAssignRows]);
  ws2['!cols'] = [28,12,18,14,28,10,18,12,12,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws2, 'Case Assignments');

  // ── Sheet 3: Individual Shell Assignments (per show, per container) ──
  const shellAssignHeader = ['Show Name','Show Date','Container','Shell #','Shell Description','Case Catalog #','Case Name','ATF Class','NET Wt (lbs)','Status','Used Date','Assigned On'];
  const shellAssignRows = [];
  state.containers.forEach(cont => {
    const contShells = cont.data.shells||[];
    const contCases = cont.data.cases||[];
    (cont.data.shellAssignments||[]).filter(a=>!a.bulkAssignId).forEach(a => {
      const sh = shows.find(x=>x.id===a.showId);
      const sl = contShells.find(x=>x.id===a.shellId);
      const c = sl ? contCases.find(x=>x.id===sl.caseId) : null;
      if (!sh||!sl) return;
      shellAssignRows.push([
        sh.name, sh.date||'', cont.name,
        sl.shellNum, sl.desc,
        c?c.catalogNum:'', c?c.name:'',
        c?(CLASS_LABELS[c.cls]||c.cls):'',
        parseFloat(lbs(sl.newW)),
        sl.status,
        sl.usedAt ? (()=>{const d=sl.usedAt.slice(0,10);const [y,m,day]=d.split('-');return m+'/'+day+'/'+y;})() : '',
        a.assignedAt ? new Date(a.assignedAt).toLocaleDateString() : ''
      ]);
    });
  });
  const ws3 = XLSX.utils.aoa_to_sheet([shellAssignHeader, ...shellAssignRows]);
  ws3['!cols'] = [28,12,18,14,28,14,28,10,12,12,12,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws3, 'Shell Assignments');

  const filename = `show_data_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
}

function printShowLabels(showId) {
  const {shells, shellAssignments} = state.data;
  const sid = Number(showId);

  // All shell assignments for this show (both manual and bulk via case assignment)
  const showShellAssigns = (shellAssignments||[]).filter(a => a.showId === sid);
  const assignedShellIds = new Set(showShellAssigns.map(a => a.shellId));

  if (!assignedShellIds.size) {
    alert('No shells assigned to this show yet.');
    return;
  }

  openLabelModal();
  requestAnimationFrame(() => {
    const caseSel  = document.getElementById('case-sel');
    const shellSel = document.getElementById('shell-sel');
    // Deselect all cases
    if (caseSel) [...caseSel.options].forEach(o => o.selected = false);
    // Select only the shells assigned to this show
    if (shellSel) [...shellSel.options].forEach(o => {
      o.selected = assignedShellIds.has(Number(o.value)) || assignedShellIds.has(o.value);
    });
    updateLabelPreview();
  });
}

function quickPrintLabel(type, id) {
  openLabelModal();
  requestAnimationFrame(() => {
    const caseSel  = document.getElementById('case-sel');
    const shellSel = document.getElementById('shell-sel');
    const numId = Number(id);

    if (type === 'case') {
      if (caseSel) [...caseSel.options].forEach(o => { o.selected = Number(o.value) === numId; });
      // Also select all active shells belonging to this case
      if (shellSel) {
        const caseShellIds = new Set(
          (state.data.shells||[]).filter(s => s.caseId === numId && s.status !== 'used').map(s => s.id)
        );
        [...shellSel.options].forEach(o => { o.selected = caseShellIds.has(Number(o.value)); });
      }
    } else {
      if (caseSel)  [...caseSel.options].forEach(o => o.selected = false);
      if (shellSel) [...shellSel.options].forEach(o => { o.selected = Number(o.value) === numId; });
    }
    updateLabelPreview();
  });
}

    };

  // ── Sheet 4: Show Assignments (detailed) ──
  if (assignments.length > 0) {
    const aHeader = ['Show Name','Show Date','Catalog #','Case Description','ATF Class','Manufacturer','Shells Assigned','NEW Assigned (lbs)','Assigned On'];
    const aRows = assignments.map(a => {
      const sh = shows.find(s => s.id === a.showId);
      const c = cases.find(x => x.id === a.caseId);
      return [
        sh ? sh.name : 'Unknown',
        sh ? sh.date || '' : '',
        c ? c.catalogNum : '',
        c ? c.name : '',
        c ? (CLASS_LABELS[c.cls] || c.cls) : '',
        c ? (c.mfg || '') : '',
        a.qty,
        c ? parseFloat(lbs(a.qty * c.newW)) : 0,
        a.assignedAt ? new Date(a.assignedAt).toLocaleDateString() : ''
      ];
    });
    const ws4 = XLSX.utils.aoa_to_sheet([aHeader, ...aRows]);
    ws4['!cols'] = [28,12,14,28,10,18,14,16,14].map(w => ({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws4, 'Show Assignments');
  }

  // ── Sheet 5: Individual Shell Assignments ──
  const allShellAssign = state.data.shellAssignments||[];
  if (allShellAssign.length > 0) {
    const saHeader = ['Show Name','Show Date','Shell #','Shell Description','Case Catalog #','Case Name','ATF Class','Net Wt (lbs)','Status','Assigned On'];
    const saRows = allShellAssign.map(a => {
      const sh = shows.find(s => s.id === a.showId);
      const sl = shells.find(x => x.id === a.shellId);
      const c = sl ? cases.find(x => x.id === sl.caseId) : null;
      return [
        sh ? sh.name : 'Unknown',
        sh ? sh.date||'' : '',
        sl ? sl.shellNum : '',
        sl ? sl.desc : '',
        c ? c.catalogNum : '',
        c ? c.name : '',
        c ? (CLASS_LABELS[c.cls]||c.cls) : '',
        sl ? parseFloat(lbs(sl.newW)) : 0,
        sl ? sl.status : '',
        a.assignedAt ? new Date(a.assignedAt).toLocaleDateString() : ''
      ];
    });
    const ws5 = XLSX.utils.aoa_to_sheet([saHeader, ...saRows]);
    ws5['!cols'] = [28,12,14,28,14,28,10,12,12,14].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws5, 'Shell Assignments');
  }

  // ── Sheet 6: Removal Log ──
  const removalLog = state.data.removalLog||[];
  if (removalLog.length > 0) {
    const rlHeader = ['Type','Catalog / Shell #','Description','Parent Case','ATF Class','NEW Removed (lbs)','Shells rem/tot','Shows Used On','Removed On','Removed With Case'];
    const rlRows = removalLog.map(e => {
      const isCase = e.type==='case';
      return [
        isCase ? 'Case' : 'Shell',
        isCase ? (e.catalogNum||'') : (e.shellNum||''),
        isCase ? (e.name||'') : (e.desc||''),
        isCase ? '' : `${e.parentCatalog||''} ${e.parentName||''}`.trim(),
        isCase ? (CLASS_LABELS[e.cls]||e.cls||'') : '',
        isCase ? parseFloat(lbs(e.remainingShells*e.newW)) : parseFloat(lbs(e.newW)),
        isCase ? `${e.remainingShells}/${e.totalShells}` : '1/1',
        (e.shows||[]).join('; '),
        e.removedAt ? new Date(e.removedAt).toLocaleString() : '',
        isCase ? '' : (e.removedWithCase ? 'Yes' : 'No'),
      ];
    });
    const ws6 = XLSX.utils.aoa_to_sheet([rlHeader, ...rlRows]);
    ws6['!cols'] = [8,14,30,24,10,14,10,30,18,14].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws6, 'Removal Log');
  }

  // Download
  const filename = `pyro_inventory_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
}


// ── Container management ───────────────────────────────────────────────────
function populateContainerSelector() {
  const sel = document.getElementById('container-sel');
  if (!sel) return;
  sel.innerHTML = state.containers.map(c =>
    `<option value="${c.id}"${c.id===state.activeContainerId?' selected':''}>${esc(c.name)}</option>`
  ).join('');
}

function switchContainer(id) {
  if (id === state.activeContainerId) return;
  // Save current container first
  saveCurrentContainer();
  // Switch
  const next = state.containers.find(x=>x.id===id);
  if (!next) return;
  state.activeContainerId = id;
  state.data = next.data;
  state.container = next.name;
  state.licensee = next.licensee || '';
  state.expandedCase = null;
  state.selectedCase = null;
  state.selectedShow = null;
  state.editingCase = null;
  state.editingShell = null;
  state.search = '';
  state.tab = 'cases';
  populateContainerSelector();
  render();
}

function openContainerManager() {
  const modal = document.getElementById('container-modal');
  const body = document.getElementById('container-modal-body');
  if (!modal || !body) return;
  body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:14px;font-weight:700;color:#e5e5e5;letter-spacing:.04em;text-transform:uppercase">Manage Containers</div>
      <button class="btn-sm" onclick="closeContainerManager()">✕ Close</button>
    </div>
    <div style="margin-bottom:14px">
      ${state.containers.map(c => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid ${c.id===state.activeContainerId?'#d97706':'#1e1e1e'};border-radius:6px;margin-bottom:6px;background:${c.id===state.activeContainerId?'#1a1200':'#0d0d0d'}">
          <input id="cname-${c.id}" style="flex:1;font-weight:600;font-family:var(--mono)" value="${esc(c.name)}" oninput="renameContainer('${c.id}',this.value)">
          ${c.id===state.activeContainerId
            ? `<span style="font-size:10px;color:#fbbf24;font-weight:700;font-family:var(--mono);padding:2px 6px;background:#2e1f0a;border-radius:3px">ACTIVE</span>`
            : `<button class="btn-sm" style="font-size:11px" onclick="switchContainer('${c.id}');closeContainerManager()">Switch</button>`}
          ${state.containers.length > 1
            ? `<button class="btn-danger" style="font-size:11px" onclick="deleteContainer('${c.id}')">×</button>`
            : ''}
        </div>`).join('')}
    </div>
    <div style="border-top:1px solid #1e1e1e;padding-top:14px">
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:8px">Add new container</div>
      <div style="display:flex;gap:8px">
        <input id="new-container-name" placeholder="e.g. Magazine A, Storage Unit 2…" style="flex:1" onkeydown="if(event.key==='Enter')addContainer()">
        <button class="btn-primary" onclick="addContainer()">+ Add</button>
      </div>
    </div>`;
  modal.style.display = 'flex';
}

function closeContainerManager() {
  document.getElementById('container-modal').style.display = 'none';
}

function renameContainer(id, name) {
  const c = state.containers.find(x=>x.id===id);
  if (c) {
    c.name = name;
    if (id === state.activeContainerId) state.container = name;
    saveContainers();
    populateContainerSelector();
  }
}

function addContainer() {
  const inp = document.getElementById('new-container-name');
  const name = inp ? inp.value.trim() : '';
  if (!name) return;
  const newC = {id:'c_'+Date.now(), name, licensee:'', data: emptyData()};
  state.containers.push(newC);
  saveContainers();
  closeContainerManager();
  switchContainer(newC.id);
}

function deleteContainer(id) {
  if (state.containers.length <= 1) return;
  state.containers = state.containers.filter(x=>x.id!==id);
  saveContainers();
  if (id === state.activeContainerId) {
    switchContainer(state.containers[0].id);
  }
  closeContainerManager();
  openContainerManager();
}

// ── Title editing ──────────────────────────────────────────────────────────
function loadTitles() {
  const t = localStorage.getItem('pyro_title');
  const s = localStorage.getItem('pyro_sub');
  if (t) document.getElementById('app-title').textContent = t;
  if (s) document.getElementById('app-sub').textContent = s;
  if (t) document.title = t + ' — ATF 5400.4';
}

function startEditTitle() {
  const el = document.getElementById('app-title');
  const cur = el.textContent;
  el.innerHTML = `<input id="title-inp" style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text1);background:transparent;border:none;border-bottom:2px solid var(--amber);outline:none;width:320px;letter-spacing:-.02em;padding:0" value="${cur.replace(/"/g,'&quot;')}" onblur="saveTitle()" onkeydown="if(event.key==='Enter'||event.key==='Escape')this.blur()">`;
  const inp = document.getElementById('title-inp');
  inp.focus(); inp.select();
}

function saveTitle() {
  const inp = document.getElementById('title-inp');
  if (!inp) return;
  const val = inp.value.trim() || 'PYRO CONTAINER';
  localStorage.setItem('pyro_title', val);
  document.getElementById('app-title').textContent = val;
  document.title = val + ' — ATF 5400.4';
}

function startEditSub() {
  const el = document.getElementById('app-sub');
  const cur = el.textContent;
  el.innerHTML = `<input id="sub-inp" style="font-size:11px;font-weight:600;color:var(--text3);background:transparent;border:none;border-bottom:1px solid var(--amber);outline:none;width:440px;letter-spacing:.08em;padding:0;text-transform:uppercase;font-family:var(--sans)" value="${cur.replace(/"/g,'&quot;')}" onblur="saveSub()" onkeydown="if(event.key==='Enter'||event.key==='Escape')this.blur()">`;
  const inp = document.getElementById('sub-inp');
  inp.focus(); inp.select();
}

function saveSub() {
  const inp = document.getElementById('sub-inp');
  if (!inp) return;
  const val = inp.value.trim() || 'ATF 5400.4 · Storage Inventory · Case & Show Tracking';
  localStorage.setItem('pyro_sub', val);
  document.getElementById('app-sub').textContent = val;
}

render();
loadTitles();
</script>

<!-- ── Shared Date Picker popup (singleton) ────────────────────────────── -->
<div id="dp-pop" class="dp-pop dp-hidden" role="dialog">
  <div class="dp-header">
    <button class="dp-nav" onclick="dpNav(-1)">&#8249;</button>
    <span class="dp-month-year" id="dp-month-year" onclick="dpToggleYearView()"></span>
    <button class="dp-nav" onclick="dpNav(1)">&#8250;</button>
  </div>
  <div class="dp-grid" id="dp-grid"></div>
  <div class="dp-time" style="display:none">
    <label>Time</label>
    <input type="time" id="dp-time-input" value="00:00">
  </div>
  <div class="dp-actions">
    <button class="dp-clear" onclick="dpClear()">Clear</button>
    <button class="dp-apply" onclick="dpApply()">Apply</button>
  </div>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
const dp={el:null,anchor:null,curY:0,curM:0,sel:null,cb:null,yearView:false};

function dpOpen(anchor, isoVal, cb) {
  dp.el = document.getElementById('dp-pop');
  dp.anchor = anchor; dp.cb = cb; dp.yearView = false;
  const now = new Date();
  if (isoVal) {
    dp.sel = new Date(isoVal);
    dp.curY = dp.sel.getFullYear(); dp.curM = dp.sel.getMonth();
    // time not shown — no need to pre-fill
  } else {
    dp.sel = null; dp.curY = now.getFullYear(); dp.curM = now.getMonth();
    document.getElementById('dp-time-input').value = '00:00';
  }
  dpRender();
  dp.el.classList.remove('dp-hidden');
  dpPos();
  setTimeout(()=>document.addEventListener('click',dpOutside,{capture:true}),80);
}

function dpPos() {
  const pop=dp.el, a=dp.anchor;
  if(!pop||!a) return;
  const r=a.getBoundingClientRect(), pw=260, ph=360;
  let top=r.bottom+6, left=r.left;
  if(left+pw>window.innerWidth-8) left=window.innerWidth-pw-8;
  if(top+ph>window.innerHeight-8) top=r.top-ph-6;
  pop.style.cssText+=`;top:${top}px;left:${left}px`;
}

function dpOutside(e) {
  const pop=document.getElementById('dp-pop');
  if(!pop||pop.contains(e.target)||(dp.anchor&&dp.anchor.contains(e.target))) return;
  dpClose();
}

function dpClose() {
  const p=document.getElementById('dp-pop');
  if(p) p.classList.add('dp-hidden');
  document.removeEventListener('click',dpOutside,true);
}

function dpNav(d) {
  if(dp.yearView){dp.curY+=d*12;}
  else{dp.curM+=d;if(dp.curM>11){dp.curM=0;dp.curY++;}if(dp.curM<0){dp.curM=11;dp.curY--;}}
  dpRender();
}

function dpToggleYearView(){dp.yearView=!dp.yearView;dpRender();}

function dpRender() {
  const my=document.getElementById('dp-month-year');
  const grid=document.getElementById('dp-grid');
  if(!my||!grid) return;

  if(dp.yearView) {
    my.textContent=`${dp.curY}–${dp.curY+11}`;
    grid.style.gridTemplateColumns='repeat(4,1fr)'; grid.style.gap='4px';
    let h='';
    for(let y=dp.curY;y<dp.curY+12;y++){
      const isSel=dp.sel&&dp.sel.getFullYear()===y;
      const isNow=y===new Date().getFullYear();
      h+=`<div onclick="dp.curY=${y};dp.yearView=false;dpRender()" style="font-size:12px;font-family:var(--mono);text-align:center;padding:6px 2px;border-radius:4px;cursor:pointer;${isSel?'background:var(--amber);color:#000;font-weight:700':isNow?'color:var(--amber)':'color:var(--text3);'}">${y}</div>`;
    }
    grid.innerHTML=h; return;
  }

  grid.style.gridTemplateColumns='repeat(7,1fr)'; grid.style.gap='2px';
  my.textContent=`${MONTHS[dp.curM]} ${dp.curY}`;
  const today=new Date();
  const firstDay=new Date(dp.curY,dp.curM,1).getDay();
  const dim=new Date(dp.curY,dp.curM+1,0).getDate();
  const dprev=new Date(dp.curY,dp.curM,0).getDate();
  let h=DOW.map(d=>`<div class="dp-dow">${d}</div>`).join('');
  for(let i=firstDay-1;i>=0;i--) h+=`<div class="dp-day dp-other">${dprev-i}</div>`;
  for(let d=1;d<=dim;d++){
    const isT=d===today.getDate()&&dp.curM===today.getMonth()&&dp.curY===today.getFullYear();
    const isS=dp.sel&&d===dp.sel.getDate()&&dp.curM===dp.sel.getMonth()&&dp.curY===dp.sel.getFullYear();
    h+=`<div class="dp-day${isT?' dp-today':''}${isS?' dp-selected':''}" onclick="dpSel(${d})">${d}</div>`;
  }
  const rem=(firstDay+dim)%7===0?0:7-(firstDay+dim)%7;
  for(let d=1;d<=rem;d++) h+=`<div class="dp-day dp-other">${d}</div>`;
  grid.innerHTML=h;
}

function dpSel(d) {
  dp.sel=new Date(dp.curY,dp.curM,d,12,0,0,0);
  dpRender();
}

function dpApply() {
  if(!dp.sel){dpClose();return;}
  // Use noon to avoid timezone boundary issues when no time is shown
  dp.sel.setHours(12,0,0,0);
  if(dp.cb) dp.cb(dp.sel.toISOString());
  dpClose();
}

function dpClear(){dp.sel=null;if(dp.cb)dp.cb(null);dpClose();}

// ── Date picker callback registry ──────────────────────────────────────────
// Avoids embedding backtick callbacks in onclick attributes (breaks HTML parsing)
const dpRegistry = {};
let dpRegSeq = 0;

function dpRegister(fn) {
  const key = 'dp' + (++dpRegSeq);
  dpRegistry[key] = fn;
  return key;
}

// Build a date picker trigger button for use in templates
// cb must be a JS function (not a string)
function dpBtn(isoVal, cb, placeholder) {
  const key = dpRegister(cb);
  const label = isoVal
    ? new Date(isoVal).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    : (placeholder || 'Set date');
  const safeIso = (isoVal || '').replace(/"/g, '');
  return `<button class="dp-trigger${isoVal ? ' dp-set' : ''}" onclick="dpOpen(this,'${safeIso}',dpRegistry['${key}'])">`
    + `<span class="dp-icon">📅</span><span>${label}</span></button>`;
}
</script>
</body>
</html>
