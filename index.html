<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyro Container Inventory — ATF 5400.4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --amber:#d97706;--amber-dim:#92400e;
  --bg:#080808;--bg1:#0d0d0d;--bg2:#111;--bg3:#141414;
  --border1:#1e1e1e;--border2:#2a2a2a;--border3:#3a3a3a;
  --text1:#f5f5f5;--text2:#e5e5e5;--text3:#888;--text4:#555;--text5:#333;
  --red:#f87171;--red-bg:#2e0f0f;--red-border:#4a1515;
  --green:#4ade80;--green-bg:#14291a;
  --blue:#60a5fa;--blue-bg:#1a2233;
  --yellow:#fbbf24;--yellow-bg:#2e1f0a;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
html,body{background:var(--bg);color:var(--text2);font-family:var(--sans);font-size:14px;min-height:100vh}
#app{max-width:1400px;margin:0 auto;padding:20px 16px}

/* ── Header ── */
.hdr{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--border1);margin-bottom:20px}
.hdr-logo{width:44px;height:44px;background:var(--amber);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-logo svg{width:24px;height:24px}
.hdr-title{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text1);letter-spacing:-.02em}
.hdr-sub{font-size:11px;color:var(--text4);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-top:2px}
.hdr-date{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text5);letter-spacing:.06em}

/* ── Metrics ── */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.pill{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:12px 16px;position:relative;overflow:hidden}
.pill::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--amber)}
.pill.green::before{background:var(--green)}
.pill.red::before{background:var(--red)}
.pill.blue::before{background:var(--blue)}
.pill-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text4);margin-bottom:6px}
.pill-val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--text1);letter-spacing:-.02em}
.pill-sub{font-size:11px;color:var(--text5);margin-top:3px}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border2);margin-bottom:20px;background:#080808;border-radius:8px 8px 0 0;padding:0 4px}
.tab-btn{padding:9px 18px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text4);background:transparent;border:none;border-bottom:2px solid transparent;letter-spacing:.05em;text-transform:uppercase;margin-bottom:-1px;transition:color .15s;font-family:var(--sans)}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);background:var(--bg2)}
.tab-btn:hover:not(.active){color:var(--text2)}

/* ── Cards ── */
.card{background:var(--bg1);border:1px solid var(--border1);border-radius:10px;overflow:hidden;margin-bottom:16px}
.card-pad{background:var(--bg1);border:1px solid var(--border1);border-radius:10px;padding:16px 20px;margin-bottom:16px}
.card-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border1);flex-wrap:wrap}

/* ── Section labels ── */
.sec{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border1)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{background:var(--bg2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text4);padding:9px 14px;text-align:left;border-bottom:1px solid var(--border2);white-space:nowrap}
tbody td{padding:10px 14px;color:var(--text2);vertical-align:middle;border-bottom:1px solid var(--border1);font-size:13px}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tfoot td{padding:9px 14px;font-size:12px;font-weight:600;background:var(--bg2);border-top:1px solid var(--border2);color:var(--text2)}
.td-sub{padding:6px 14px 6px 28px;color:var(--text4);vertical-align:middle;border-bottom:1px solid var(--border1);font-size:12px;background:#0a0a0a}

/* ── Forms ── */
.form-grid{display:grid;gap:8px;margin-bottom:10px}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--text4);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{height:34px;border:1px solid var(--border2);border-radius:6px;padding:0 10px;font-size:13px;background:var(--bg3);color:var(--text2);width:100%;font-family:var(--sans);outline:none}
input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(217,119,6,.25)}
input::placeholder{color:var(--text5)}
select option{background:var(--bg3);color:var(--text2)}

/* ── Buttons ── */
.btn-primary{height:34px;padding:0 18px;background:var(--amber);color:#000;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase;font-family:var(--sans)}
.btn-primary:hover{background:#f59e0b}
.btn-sm{border:1px solid var(--border2);background:transparent;color:var(--text3);border-radius:5px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:var(--sans)}
.btn-sm:hover{background:var(--bg3);color:var(--text2)}
.btn-sm.success{border-color:#143d1a;color:var(--green)}
.btn-danger{border:1px solid var(--red-border);background:transparent;color:var(--red);border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:var(--sans)}
.btn-danger:hover{background:var(--red-bg)}
.btn-icon{width:24px;height:24px;border:1px solid var(--border2);border-radius:5px;background:var(--bg3);color:var(--text2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-family:var(--sans)}
.btn-icon:hover{background:var(--bg2)}

/* ── Badges ── */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;font-family:var(--mono)}
.badge-1C{background:#2a1f4a;color:#c4b5fd}
.badge-1D{background:#1a2e44;color:#7dd3fc}
.badge-2G{background:#1a2e1f;color:#86efac}
.badge-3G{background:#2e1f0a;color:#fbbf24}
.badge-4G{background:#2e0f0f;color:#fca5a5}
.badge-other{background:#1e1e1e;color:#9ca3af}
.badge-sealed{background:#14291a;color:#4ade80}
.badge-used{background:#1a0f0f;color:#9ca3af}

/* ── Date picker ── */
.dp-wrap{position:relative;display:inline-block}
.dp-trigger{display:flex;align-items:center;gap:5px;font-size:11px;font-family:var(--mono);color:var(--text3);background:var(--bg1);border:1px solid var(--border2);border-radius:4px;padding:3px 7px;cursor:pointer;white-space:nowrap;user-select:none;min-width:110px}
.dp-trigger:hover{border-color:var(--amber);color:var(--text2)}
.dp-trigger .dp-icon{font-size:12px;flex-shrink:0}
.dp-trigger.dp-set{color:var(--text2);border-color:var(--border3)}
.dp-pop{position:fixed;z-index:9999;background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.8);width:260px;user-select:none}
.dp-pop.dp-hidden{display:none}
.dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dp-nav{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;line-height:1}
.dp-nav:hover{background:var(--border2);color:var(--text1)}
.dp-month-year{font-size:13px;font-weight:700;color:var(--text1);cursor:pointer;padding:2px 6px;border-radius:4px}
.dp-month-year:hover{background:var(--border2)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px}
.dp-dow{font-size:10px;font-weight:700;color:var(--text5);text-align:center;padding:3px 0;letter-spacing:.04em}
.dp-day{font-size:12px;font-family:var(--mono);text-align:center;padding:5px 0;border-radius:4px;cursor:pointer;color:var(--text3)}
.dp-day:hover{background:var(--border2);color:var(--text1)}
.dp-day.dp-today{color:var(--amber);font-weight:700}
.dp-day.dp-selected{background:var(--amber);color:#000;font-weight:700}
.dp-day.dp-other{color:var(--text5)}
.dp-day.dp-disabled{opacity:0.3;cursor:default;pointer-events:none}
.dp-time{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border2);padding-top:10px;margin-top:2px}
.dp-time label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text4);flex-shrink:0}
.dp-time input{background:var(--bg);border:1px solid var(--border2);border-radius:4px;color:var(--text2);font-family:var(--mono);font-size:12px;padding:3px 6px;width:80px}
.dp-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.dp-clear{background:none;border:1px solid var(--border2);color:var(--text4);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer}
.dp-clear:hover{border-color:var(--border3);color:var(--text2)}
.dp-apply{background:var(--amber);border:none;color:#000;border-radius:4px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer}
.dp-apply:hover{background:#f59e0b}

.badge-open{background:#2e1f0a;color:#fbbf24}
.badge-partial{background:#1a2233;color:#60a5fa}
.badge-empty{background:#1a1a1a;color:#6b7280}
.badge-upcoming{background:#1a2233;color:#60a5fa}
.badge-active{background:#2e1f0a;color:#fbbf24}
.badge-complete{background:#14291a;color:#4ade80}
.badge-cancelled{background:#1a1a1a;color:#6b7280}
.badge-assigned{background:#1a2233;color:#60a5fa;font-family:var(--mono)}

/* ── Mono catalog number ── */
.mono-tag{font-family:var(--mono);font-size:12px;background:var(--bg3);color:var(--amber);padding:2px 8px;border-radius:4px;border:1px solid var(--border2);white-space:nowrap;font-weight:700}

/* ── Spinner ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--amber);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Drop zone ── */
.drop-zone{border:2px dashed var(--border2);background:#0a0a0a;border-radius:10px;padding:40px 24px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;margin-bottom:12px}
.drop-zone.over,.drop-zone:hover{border-color:var(--amber);background:#1a1000}
.drop-title{font-size:14px;font-weight:700;color:var(--text1);margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.drop-sub{font-size:12px;color:var(--text4)}
.drop-sub a{color:var(--amber);text-decoration:underline;cursor:pointer}

/* ── Status message ── */
.parse-msg{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:12px}

/* ── Expanded row ── */
.exp-row{background:#0a0a0a;padding:10px 16px 10px 48px;font-size:12px;border-bottom:1px solid var(--border1)}
.exp-facts{display:flex;flex-wrap:wrap;gap:6px 24px;color:var(--text4);margin-bottom:8px}
.exp-facts strong{color:var(--text2)}
.exp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.exp-sec{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text5);margin-bottom:4px}

/* ── Inline edit ── */
.edit-input{height:28px;font-size:12px;padding:0 8px;border:1px solid var(--border2);border-radius:5px;background:var(--bg3);color:var(--text2);width:100%}
.edit-input:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(217,119,6,.2)}
.editable-val{cursor:pointer;border-bottom:1px dashed var(--border2);display:inline}

/* ── Empty states ── */
.empty{text-align:center;padding:40px;color:var(--text5);font-size:13px}

/* ── Error text ── */
.err-txt{font-size:12px;color:var(--red);margin-top:6px}

/* ── Help text ── */
.help-txt{font-size:12px;color:var(--text5);margin-top:6px}

/* ── Qty control ── */
.qty-ctrl{display:flex;align-items:center;gap:4px}
.qty-val{font-weight:700;min-width:44px;text-align:center;color:var(--text1);font-family:var(--mono)}
.qty-frac{font-weight:400;color:var(--text5)}

/* ── Show detail header ── */
.detail-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border1)}
.detail-name{font-size:16px;font-weight:700;color:var(--text1);flex:1;font-family:var(--mono);letter-spacing:-.01em}

/* ── Report section ── */
.report-meta-row{display:flex;gap:6px;margin-bottom:8px;font-size:12px;color:var(--text4)}
.report-meta-row strong{color:var(--text2)}

/* ── Responsive ── */
@media(max-width:700px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr !important}
  thead{display:none}
  tbody td{display:block;border:none;padding:4px 14px}
  tbody td::before{content:attr(data-label)': ';font-size:10px;color:var(--text4);display:block}
}
</style>
</head>

  <div class="hdr">

          <button class="btn-sm" style="font-size:11px;white-space:nowrap" onclick="openContainerManager()">⚙ Manage</button>

    </div>
    <div class="hdr-date" id="hdr-date"></div>

  <div id="container-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center">

  </div>

  <div id="label-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center">
    <div style="background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:24px;width:560px;max-width:95vw;max-height:85vh;overflow-y:auto" id="label-modal-body"></div>
  </div>

  <!-- Metrics -->
  <div class="metrics" style="grid-template-columns:repeat(5,1fr)">
    <div class="pill"><div class="pill-lbl">Cases in container</div><div class="pill-val" id="m-cases">0</div><div class="pill-sub" id="m-cases-sub"></div></div>
    <div class="pill"><div class="pill-lbl">Unopened cases</div><div class="pill-val" id="m-sealed">0</div><div class="pill-sub" id="m-sealed-sub"></div></div>
    <div class="pill"><div class="pill-lbl">Loose shells</div><div class="pill-val" id="m-loose">0</div><div class="pill-sub" id="m-loose-sub"></div></div>
    <div class="pill" id="pill-new"><div class="pill-lbl">Total NEW remaining (lbs)</div><div class="pill-val" id="m-new">0.0000</div></div>
    <div class="pill"><div class="pill-lbl">Shows</div><div class="pill-val" id="m-shows">0</div><div class="pill-sub" id="m-shows-sub"></div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('cases')" id="tab-cases">Cases</button>
    <button class="tab-btn" onclick="switchTab('shows')" id="tab-shows">Shows</button>
    <button class="tab-btn" onclick="switchTab('add')" id="tab-add">Add Case</button>
    <button class="tab-btn" onclick="switchTab('invoice')" id="tab-invoice">📥 Import Invoice</button>
    <button class="tab-btn" onclick="switchTab('report')" id="tab-report">ATF Report</button>
    <button class="tab-btn" onclick="switchTab('log')" id="tab-log">📋 Log</button>
  </div>

  <!-- Tab panels -->
  <div id="panel-cases"></div>
  <div id="panel-shows" style="display:none"></div>
  <div id="panel-add" style="display:none"></div>
  <div id="panel-invoice" style="display:none"></div>
  <div id="panel-report" style="display:none"></div>
  <div id="panel-log" style="display:none"></div>

  <!-- Hidden file input -->
</div>

function loadSharedShows() {
  try {
    const saved = JSON.parse(localStorage.getItem(SHOWS_KEY)||'null');
    if (saved) return saved;
  } catch {}
  // Migrate shows from the first container's data
  const containers = JSON.parse(localStorage.getItem(CONTAINERS_KEY)||'null');
  if (containers && containers[0] && containers[0].data && containers[0].data.shows) {
    const shows = containers[0].data.shows;
    localStorage.setItem(SHOWS_KEY, JSON.stringify(shows));
    return shows;
  }
  return [];
}
function saveSharedShows() {
  try { localStorage.setItem(SHOWS_KEY, JSON.stringify(state.shows)); } catch {}
}

function loadContainers() {
  try {
    const saved = JSON.parse(localStorage.getItem(CONTAINERS_KEY)||'null');
    if (saved && saved.length) return saved;
  } catch {}
  // Migrate existing single-container data as "Container 1"
  const existing = loadLegacyData();
  const c1 = {id:'c_'+Date.now(), name:'Container 1', licensee:'', data: existing};
  const list = [c1];
  localStorage.setItem(CONTAINERS_KEY, JSON.stringify(list));
  return list;
}
function loadLegacyData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    const v5 = !d ? JSON.parse(localStorage.getItem('fw_inv_v5')||'null') : null;
    const v4 = !d && !v5 ? JSON.parse(localStorage.getItem('fw_inv_v4')||'null') : null;
    const raw = d || (v5?{cases:v5.cases||[],shells:v5.shells||[],shows:v5.shows||[],assignments:v5.assignments||[],shellAssignments:[],removalLog:[]}:null)
      || (v4?{cases:v4.cases||[],shells:v4.shells||[],shows:[],assignments:[],shellAssignments:[],removalLog:[]}:null)
      || {cases:[],shells:[],shows:[],assignments:[],shellAssignments:[],removalLog:[]};
    if (!raw.shellAssignments) raw.shellAssignments=[];
    if (!raw.removalLog) raw.removalLog=[];
    return raw;
  } catch { return {cases:[],shells:[],assignments:[],shellAssignments:[],removalLog:[]}; }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function genId(type, sizePrefix) {
  // Gather all existing numbers to avoid collisions
  const usedCatalogs = new Set([
    ...(state.data.cases||[]).map(c=>c.catalogNum),
    ...(state.data.removalLog||[]).map(e=>e.catalogNum||e.shellNum).filter(Boolean),
  ]);
  const usedShells = new Set([
    ...(state.data.shells||[]).map(s=>s.shellNum),
    ...(state.data.removalLog||[]).map(e=>e.shellNum).filter(Boolean),
  ]);
  const used = type==='shell' ? usedShells : usedCatalogs;
  const prefix = type==='shell' && sizePrefix ? `${sizePrefix.trim().replace(/"/g,'')}-` : `${new Date().getFullYear()}-`;
  let attempt = 0;
  while (attempt < 1000) {
    const num = String(Math.floor(1000 + Math.random() * 9000));
    const candidate = `${prefix}${num}`;
    if (!used.has(candidate)) return candidate;
    attempt++;
  }
  // Fallback: 6 digits
  return `${prefix}${Math.floor(100000 + Math.random() * 900000)}`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function badge(cls) {
  const lbl = CLASS_LABELS[cls]||cls;
  return `<span class="badge badge-${esc(cls)}">${esc(lbl)}</span>`;
}
function statusBadge(status, map) {
  const m = map||CASE_STATUS;
  const lbl = (m[status]||{label:status}).label;
  return `<span class="badge badge-${esc(status)}">${esc(lbl)}</span>`;
}
function lbs(oz) { return (oz/16).toFixed(4); }

// Returns 'assigned' if shell has any active show assignment, else its stored status
function shellDisplayStatus(shellId) {
  const sa = state.data.shellAssignments||[];
  return sa.some(a=>a.shellId===shellId) ? 'assigned' : (state.data.shells.find(s=>s.id===shellId)||{}).status||'intact';
}
// Derives case status from shell counts — overrides stored status if counts don't match
function caseDisplayStatus(c) {
  if (!c) return 'sealed';
  if (c.status === 'used') return 'used';
  if (c.remainingShells === 0) return 'empty';
  if (c.remainingShells < c.totalShells) return 'partial';
  return c.status === 'empty' || c.status === 'partial' ? 'sealed' : c.status;
}
// Color maps include 'assigned'
const SHELL_SC = {intact:'#14291a',used:'#2e0f0f',damaged:'#2e1f0a',missing:'#1a1a1a',assigned:'#1a2233'};
const SHELL_TC = {intact:'#4ade80',used:'#fca5a5',damaged:'#fbbf24',missing:'#6b7280',assigned:'#60a5fa'};

function updateMetrics() {
  const {cases, shells} = state.data; const shows = state.shows;
  const activeCases = cases.filter(c=>caseDisplayStatus(c)!=='used');

  // Split single units from real cases
  const realCases   = activeCases.filter(c=>!c.isSingle);
  const singleUnits = activeCases.filter(c=>c.isSingle);

  // Unopened = sealed real cases
  const sealedCases  = realCases.filter(c=>caseDisplayStatus(c)==='sealed');
  const sealedShells = sealedCases.reduce((s,c)=>s+(c.remainingShells||0),0);

  // Open/partial real cases
  const openCases    = realCases.filter(c=>{ const ds=caseDisplayStatus(c); return ds==='open'||ds==='partial'; });
  const openCaseCount = openCases.length;

  // Loose shells = shells from open/partial real cases + all single units
  const looseFromOpen    = openCases.reduce((s,c)=>s+(c.remainingShells||0),0);
  const looseFromSingles = singleUnits.reduce((s,c)=>s+(c.remainingShells||0),0);
  const totalLoose       = looseFromOpen + looseFromSingles;

  const totalNEW = activeCases.reduce((s,c)=>s+(c.remainingShells||0)*(c.newW||0),0);

  // Cases pill — real cases only
  document.getElementById('m-cases').textContent = realCases.length;
  document.getElementById('m-cases-sub').textContent =
    `${sealedCases.length} sealed · ${openCaseCount} open`;

  // Unopened cases pill
  document.getElementById('m-sealed').textContent = sealedCases.length;
  document.getElementById('m-sealed-sub').textContent =
    `${sealedShells.toLocaleString()} shells inside`;

  // Loose shells pill — open case shells + single units
  document.getElementById('m-loose').textContent = totalLoose.toLocaleString();
  const looseParts = [];
  if (looseFromOpen > 0)    looseParts.push(`${looseFromOpen} from ${openCaseCount} open case${openCaseCount!==1?'s':''}`);
  if (looseFromSingles > 0) looseParts.push(`${looseFromSingles} single unit${looseFromSingles!==1?'s':''}`);
  document.getElementById('m-loose-sub').textContent = looseParts.join(' · ') || 'none';

  document.getElementById('m-new').textContent = lbs(totalNEW);
  document.getElementById('pill-new').className = 'pill'+(totalNEW>80000?' red':' green');

  document.getElementById('m-shows').textContent = shows.length;
  document.getElementById('m-shows-sub').textContent = shows.filter(s=>s.status==='upcoming').length+' upcoming';

  // Tab labels — real cases only in count
  document.getElementById('tab-cases').textContent = `Cases (${realCases.length})`;
  document.getElementById('tab-shows').textContent = `Shows (${shows.length})`;
  const logCount = (state.data.removalLog||[]).length;
  document.getElementById('tab-log').textContent = logCount > 0 ? `📋 Log (${logCount})` : '📋 Log';
}

function switchTab(name) {
  state.tab = name;
  state.selectedCase = null;
  state.selectedShow = null;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  ['cases','shows','add','invoice','report','log'].forEach(t => {
    const p = document.getElementById('panel-'+t);
    if (p) p.style.display = t===name ? '' : 'none';
  });
  render();
}

// ── Auto-mark shells used after show date ──────────────────────────────────
function autoMarkUsedByShowDate() {
  const today = new Date();
  today.setHours(0,0,0,0);
  let changed = false;

  (state.data.shellAssignments||[]).forEach(sa => {
    const sh = state.shows.find(x=>x.id===sa.showId);
    if (!sh || !sh.date) return;
    const showDate = new Date(sh.date + 'T00:00:00');
    // Only auto-mark after show date has passed
    if (showDate >= today) return;

    const s = state.data.shells.find(x=>x.id===sa.shellId);
    if (!s || s.status === 'used') return; // already used

    // Mark as used — same logic as updateShellStatus but inline
    s.status = 'used';
    s.usedAt = s.usedAt || (showDate.toISOString()); // use show date as usedAt
    s.usedOnShow = sh.name;
    s.autoMarked = true; // flag so we know it was auto-set

    // Decrement parent case remaining
    const c = state.data.cases.find(x=>x.id===s.caseId);
    if (c && c.remainingShells > 0) {
      c.remainingShells = Math.max(0, c.remainingShells - 1);
      c.status = c.remainingShells === 0 ? 'empty' : 'partial';
    }

    // Log it
    if (!state.data.removalLog) state.data.removalLog = [];
    const alreadyLogged = state.data.removalLog.some(e=>e.markedUsed && e.shellNum===s.shellNum);
    if (!alreadyLogged) {
      state.data.removalLog.push({
        id: Date.now() + Math.random(),
        type: 'shell', removedAt: s.usedAt,
        parentCatalog: (state.data.cases.find(x=>x.id===s.caseId)||{}).catalogNum||'',
        parentName: (state.data.cases.find(x=>x.id===s.caseId)||{}).name||'',
        shellNum: s.shellNum, desc: s.desc, newW: s.newW,
        status: 'used', shows: [sh.name],
        removedWithCase: false, markedUsed: true, autoMarked: true,
      });
    }
    // Auto-log case if all shells now used
    checkCaseAllShellsUsed(s.caseId);
    changed = true;
  });

  if (changed) save();
}

function render() {
  autoMarkUsedByShowDate();
  populateContainerSelector();
  updateMetrics();
  document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'2-digit'}).toUpperCase();
  renderTab(state.tab);
}

function renderTab(tab) {
  if (tab==='cases') renderCasesTab();
  else if (tab==='shows') renderShowsTab();
  else if (tab==='add') renderAddTab();
  else if (tab==='invoice') renderInvoiceTab();
  else if (tab==='report') renderReportTab();
  else if (tab==='log') renderLogTab();
}

// ── CASES TAB ──────────────────────────────────────────────────────────────
function renderCasesTab() {
  const el = document.getElementById('panel-cases');
  if (state.selectedCase) { renderShellDetail(el); return; }
  const {cases,shells,assignments,shows} = state.data;
  const {search,showFilter,statusFilter} = state;
  const allShows = [...new Set(cases.map(c=>c.show).filter(Boolean))];
  const filtered = cases.filter(c => {
    const ms = !search||c.name.toLowerCase().includes(search.toLowerCase())||c.catalogNum.toLowerCase().includes(search.toLowerCase())||(c.mfg||'').toLowerCase().includes(search.toLowerCase());
    const msh = !showFilter||c.show===showFilter;

    const mfgTd = isEdit

    const exNumTd = isEdit

      : `<span style="font-family:var(--mono);font-size:12px;color:#888">${esc(c.exNum||'—')}</span>`;

    const productTypeTd = isEdit

         </div>`

    let expRow = '';

      const remNEW = lbs(c.remainingShells*c.newW);

      const assignPills = cAssign.map(a=>{

      expRow = `<tr><td colspan="12" style="padding:0;border-bottom:1px solid var(--border1)">

            ${(()=>{const cc=c.caseCost!=null?c.caseCost:(c.price!=null?c.price:null);if(cc==null)return '';const uc=(cc/c.totalShells).toFixed(2);return `<span>Case cost: <strong>$${parseFloat(cc).toFixed(2)}</strong></span><span>Unit cost: <strong>$${uc}</strong></span>`;})()}

            ${c.exNum?`<span>EX #: <strong style="font-family:var(--mono);color:var(--amber)">${esc(c.exNum)}</strong></span>`:''}

            </span>
            <span>Source: <strong>${esc(c.source)}</strong></span>
          </div>
          ${c.notes?`
          <div style="margin-top:8px;padding:8px 10px;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:5px;font-size:12px;color:#aaa;white-space:pre-wrap;line-height:1.5">
            <span style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#444;display:block;margin-bottom:4px">Notes${c.notesOnReport?` <span style="color:#d97706">· On ATF report</span>`:''}  <button onclick="editCaseNotes(${c.id})" style="background:none;border:none;color:#555;cursor:pointer;font-size:10px;padding:0;margin-left:6px;text-decoration:underline">edit</button></span>
            ${esc(c.notes)}

      <td>

            ? `<button class="btn-danger" style="font-size:11px;white-space:nowrap" onclick="removeCaseFromContainer(${c.id})">Remove from container</button>`

          <option value="">All statuses</option>
          ${Object.entries(CASE_STATUS).map(([k,v])=>`<option value="${k}"${statusFilter===k?' selected':''}>${v.label}</option>`).join('')}
        </select>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:#555;flex:none">
          <input type="checkbox" ${state.showUsedCases?'checked':''} onchange="state.showUsedCases=this.checked;renderTab('cases')" style="accent-color:#9ca3af;width:13px;height:13px">

        ? `<div class="empty">No cases yet. Use Add Case to get started.</div>`

          <colgroup><col style="width:8%"><col style="width:14%"><col style="width:5%"><col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:9%"><col style="width:7%"><col style="width:7%"><col style="width:12%"></colgroup>

          <tbody>${rows}</tbody>

            <td colspan="3">${lbs(filtered.reduce((s,c)=>s+c.remainingShells*c.newW,0))} lbs NEW</td>
          </tr></tfoot>
        </table></div>`}
    </div>`;
}

// ── Shell detail ───────────────────────────────────────────────────────────
function renderShellDetail(el) {

  if (!c) { state.selectedCase=null; renderCasesTab(); return; }

  const intact = cShells.filter(s=>s.status==='intact').length;

  const shellRows = cShells.map(s => {
    const isEditS = state.editingShell && state.editingShell.id===s.id;
    const descCell = isEditS
      ? `<input class="edit-input" value="${esc(state.editingShell.desc)}" oninput="state.editingShell.desc=this.value" onkeydown="shellEditKeydown(event)" placeholder="Description / lot" autofocus style="width:100%"/>`
      : `<span class="editable-val" title="Click Edit to change" style="cursor:default">${esc(s.desc)}</span>`;
    const newWCell = isEditS
      ? `<input class="edit-input" type="number" min=".0001" step=".0001" value="${esc(state.editingShell.newW)}" oninput="state.editingShell.newW=this.value" onkeydown="shellEditKeydown(event)" style="width:90px"/>`
      : `<span class="editable-val" onclick="startEditShell(${s.id})">${lbs(s.newW)}</span>`;
    const actBtns = isEditS
      ? `<div style="display:flex;gap:4px"><button class="btn-sm success" onclick="saveEditingShell()">Save</button><button class="btn-sm" onclick="state.editingShell=null;renderTab('cases')">Cancel</button></div>`
      : `<button class="btn-sm" style="font-size:11px" onclick="startEditShell(${s.id})">Edit</button><button class="btn-sm" title="Print label for this shell" onclick="quickPrintLabel('shell',${s.id})" style="font-size:11px;padding:3px 7px">🏷</button><button class="btn-danger" onclick="removeShell(${s.id})">×</button>`;
    const usedOnCell = s.status==='used'
      ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <input type="date" style="height:28px;border:1px solid #2a2a2a;border-radius:5px;padding:0 6px;font-size:12px;background:#141414;color:#fbbf24;font-family:var(--mono);width:140px"
            value="${s.usedAt?s.usedAt.slice(0,10):''}"
            onchange="saveUsedDate(${s.id},this.value)">
          ${s.usedOnShow?`<span style="font-size:11px;color:#60a5fa;font-family:var(--mono)">${esc(s.usedOnShow)}</span>`:''}
        </div>`
      : `<span style="color:#333;font-size:12px">—</span>`;
    return `<tr>
      <td><span class="mono-tag">${esc(s.shellNum)}</span>${s.isChain?`<br><span style="font-size:9px;background:#1a2e1f;color:#86efac;padding:1px 5px;border-radius:3px;font-weight:700;font-family:var(--mono)">${s.shellsPerUnit} shells/fuse</span>`:''}</td>
      <td style="font-weight:600;padding:6px 14px">${descCell}</td>
      <td style="padding:6px 14px">${newWCell}${s.isChain?`<div style="font-size:10px;color:#555;margin-top:2px">total chain NEW</div>`:''}</td>
      <td>
        ${(()=>{const dSt=shellDisplayStatus(s.id);return dSt==='assigned'?`<span style="font-size:11px;background:${SHELL_SC.assigned};color:${SHELL_TC.assigned};padding:2px 8px;border-radius:3px;font-weight:700;font-family:var(--mono);display:inline-block;margin-bottom:4px">ASSIGNED</span><br>`:''})()}
        <select style="width:auto;height:28px;font-size:12px" onchange="updateShellStatus(${s.id},this.value)">
          ${['intact','used','damaged','missing'].map(st=>`<option value="${st}"${s.status===st?' selected':''}>${st.charAt(0).toUpperCase()+st.slice(1)}</option>`).join('')}
        </select>
      </td>
      <td>
        <div style="font-size:11px;color:#86efac;font-family:var(--mono);margin-bottom:3px">${s.addedAt?new Date(s.addedAt).toLocaleDateString():'—'}</div>

      <td style="font-size:12px;color:#888">${esc(s.notes||'—')}</td>

  el.innerHTML = `

      <button class="btn-sm" onclick="state.selectedCase=null;state.shellForm.shellSize='';renderTab('cases')">← Cases</button>

    </div>
    <div class="metrics" style="grid-template-columns:repeat(5,1fr)">
      <div class="pill"><div class="pill-lbl">Total shells</div><div class="pill-val">${c.totalShells}</div></div>
